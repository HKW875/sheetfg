const {useState,useEffect,useContext,createContext,useRef,useCallback} = React;
const BASE = 'https://sheetbackend-9rpx.onrender.com/api';

async function apiFetch(path, opts={}) {
  const token = localStorage.getItem('sf_token');
  const headers = {...(opts.headers||{})};
  if (token) headers['Authorization'] = `Bearer ${token}`;
  if (!(opts.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  const res = await fetch(`${BASE}${path}`, {...opts, headers});
  if (!res.ok) { const e = await res.json().catch(()=>({error:res.statusText})); throw new Error(e.error||'Failed'); }
  return res.json();
}

// ── Contexts ──────────────────────────────────────────────────────────────────
const AuthCtx = createContext(null);
function AuthProvider({children}) {
  const [user,setUser]=useState(null); const [loading,setLoading]=useState(true);
  useEffect(()=>{
    const t=localStorage.getItem('sf_token');
    if(!t){setLoading(false);return;}
    apiFetch('/auth/me').then(u=>setUser(u)).catch(()=>localStorage.removeItem('sf_token')).finally(()=>setLoading(false));
  },[]);
  const login=(token,u)=>{localStorage.setItem('sf_token',token);setUser(u);};
  const logout=()=>{localStorage.removeItem('sf_token');setUser(null);};
  return <AuthCtx.Provider value={{user,loading,login,logout}}>{children}</AuthCtx.Provider>;
}
const useAuth=()=>useContext(AuthCtx);

const RouterCtx = createContext(null);
function Router({children}) {
  const [path,setPath]=useState(window.location.hash.slice(1)||'/');
  useEffect(()=>{ const h=()=>setPath(window.location.hash.slice(1)||'/'); window.addEventListener('hashchange',h); return()=>window.removeEventListener('hashchange',h); },[]);
  const navigate=useCallback(p=>{window.location.hash=p;},[]);
  return <RouterCtx.Provider value={{path,navigate}}>{children}</RouterCtx.Provider>;
}
const useRouter=()=>useContext(RouterCtx);
function useRoute(pat) {
  const {path}=useRouter(); const p=pat.split('/'),s=path.split('/');
  if(p.length!==s.length)return[false,{}];
  const params={};
  for(let i=0;i<p.length;i++){if(p[i].startsWith(':'))params[p[i].slice(1)]=s[i];else if(p[i]!==s[i])return[false,{}];}
  return[true,params];
}

function I({name,size=16,className=''}) {
  const d=ICONS[name]; if(!d) return null;
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d={d}/></svg>;
}
function cn(...c){return c.filter(Boolean).join(' ');}
function Spinner({size=18}){
  return <div className="spin" style={{width:size,height:size,borderRadius:'50%',border:`2px solid rgba(255,255,255,.15)`,borderTopColor:'#3d7eff'}}/>;
}
function Badge({label,variant='default'}) {
  const s={default:'bg-muted text-muted-foreground',uploaded:'bg-slate-500/20 text-slate-400',
    analyzing:'bg-warning/20 text-warning pulse',converting:'bg-primary/20 text-primary pulse',
    ready:'bg-success/20 text-success',approved:'bg-purple-500/20 text-purple-400',
    saved:'bg-secondary/20 text-secondary',open:'bg-primary/20 text-primary',
    ordered:'bg-success/20 text-success',confirmed:'bg-primary/20 text-primary',
    in_production:'bg-warning/20 text-warning',qc:'bg-purple-500/20 text-purple-400',
    shipped:'bg-secondary/20 text-secondary',delivered:'bg-success/20 text-success'};
  return <span className={cn('inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold uppercase tracking-wide',s[variant]||s.default)}><span className="w-1.5 h-1.5 rounded-full bg-current"/>{label}</span>;
}
function Field({label,type='text',value,onChange,required,placeholder,children}) {
  return <div>
    <label className="block text-[12px] font-medium text-muted-foreground mb-1.5 uppercase tracking-[0.5px]">{label}</label>
    {children||<input type={type} required={required} value={value} onChange={onChange} placeholder={placeholder}
      className="w-full p-2.5 bg-background border border-border rounded-lg text-sm text-foreground focus:border-primary focus:outline-none transition-colors"/>}
  </div>;
}

  const nav=[
    {href:'/dashboard',label:'Dashboard',icon:'dashboard'},
    {href:'/designs',  label:'Designs',  icon:'file'},
    {href:'/quotes',   label:'Quotes',   icon:'calculator'},
    {href:'/providers',label:'Providers',icon:'users'},
    {href:'/orders',   label:'Orders',   icon:'package'},
    {href:'/gcode',    label:'GCode Studio',icon:'terminal'},
    {href:'/ai-studio',label:'AI Studio',icon:'cpu'},
  ];
  const active=href=>path===href||path.startsWith(href+'/');
  return (
    <div className="w-60 min-w-[240px] bg-sidebar border-r border-border flex flex-col py-5">
      <div className="px-5 pb-5 mb-4 flex items-center gap-2.5 font-sans font-extrabold text-lg border-b border-border">

      </div>
      <div className="flex-1 overflow-y-auto flex flex-col gap-0.5">
        {nav.map(item=>(
          <a key={item.href} href={`#${item.href}`} className={cn('flex items-center gap-2.5 px-5 py-2.5 cursor-pointer transition-all text-[13.5px] font-medium border-l-2',

        <div className="mt-auto px-5 pt-4 flex items-center gap-2.5 border-t border-border">
          <div className="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white uppercase" style={{background:'linear-gradient(135deg,#3d7eff,#a855f7)'}}>
            {user.firstName?.[0]}{user.lastName?.[0]}

          <div className="flex-1 min-w-0">
            <div className="text-[13px] font-semibold truncate">{user.firstName} {user.lastName}</div>
            <div className="text-[11px] text-muted-foreground capitalize">{user.role}</div>
          </div>

        </div>
      )}

}
function Topbar({title,subtitle,actions}) {
  return (
    <div className="px-7 py-4 border-b border-border flex items-center gap-4 bg-sidebar sticky top-0 z-50">
      <div><h1 className="font-sans text-base font-bold">{title}</h1>{subtitle&&<p className="text-xs text-muted-foreground mt-0.5">{subtitle}</p>}</div>
      <div className="ml-auto flex items-center gap-2.5">{actions}</div>
    </div>
  );
}
function AppLayout({children}) {
  const {user,loading}=useAuth(); const {navigate}=useRouter();
  useEffect(()=>{if(!loading&&!user)navigate('/');},[user,loading]);
  if(loading) return <div className="h-screen w-full flex items-center justify-center bg-background"><Spinner size={32}/></div>;
  if(!user) return null;
  return (
    <div className="flex h-screen w-full bg-background overflow-hidden dark text-foreground">
      <Sidebar/>
      <div className="flex-1 overflow-y-auto flex flex-col">{children}</div>
    </div>
  );
}

// ── Auth Page ─────────────────────────────────────────────────────────────────
function AuthPage() {
  const [isLogin,setIsLogin]=useState(true); const [role,setRole]=useState('designer');
  const [email,setEmail]=useState(''); const [password,setPwd]=useState('');
  const [firstName,setFirst]=useState(''); const [lastName,setLast]=useState('');
  const [company,setCompany]=useState(''); const [loading,setLoading]=useState(false); const [error,setError]=useState('');
  const {login}=useAuth(); const {navigate}=useRouter();
  const submit=async e=>{
    e.preventDefault();setError('');setLoading(true);
    try{
      const body=isLogin?{email,password}:{email,password,firstName,lastName,role,company};
      const data=await apiFetch(isLogin?'/auth/login':'/auth/register',{method:'POST',body:JSON.stringify(body)});
      login(data.token,data.user);navigate('/dashboard');
    }catch(err){setError(err.message);}finally{setLoading(false);}
  };
  return (
    <div className="fixed inset-0 z-50 bg-background flex items-center justify-center flex-col dark text-foreground">
      <div style={{position:'absolute',top:'-200px',left:'50%',transform:'translateX(-50%)',width:'800px',height:'800px',background:'radial-gradient(ellipse,rgba(61,126,255,.08) 0%,transparent 70%)',borderRadius:'50%',pointerEvents:'none'}}/>
      <div className="flex items-center gap-3 mb-12 font-sans text-[28px] font-extrabold">
        <div className="w-11 h-11 bg-primary rounded-xl flex items-center justify-center text-white"><I name="hexagon" size={24}/></div>
        SheetForge <span className="text-primary text-lg font-mono ml-1">v4</span>
      </div>
      <div className="bg-card border border-border rounded-2xl p-10 w-[420px] relative z-10 shadow-2xl">
        <div className="flex p-1 bg-background rounded-lg mb-7">
          {['Sign In','Create Account'].map((lbl,i)=>(
            <button key={lbl} className={cn('flex-1 py-2 text-[13px] font-medium rounded-md transition-all',(!i?isLogin:!isLogin)?'bg-primary text-white':'text-muted-foreground')} onClick={()=>{setIsLogin(!i);setError('');}}>
              {lbl}
            </button>
          ))}
        </div>
        <form onSubmit={submit} className="flex flex-col gap-4">
          {!isLogin&&<>
            <div className="grid grid-cols-2 gap-2.5 mb-2">
              {['designer','provider'].map(r=>(
                <button key={r} type="button" onClick={()=>setRole(r)} className={cn('border rounded-lg p-3.5 text-center transition-all',role===r?'border-primary bg-primary/10':'border-border hover:border-primary')}>
                  <I name={r==='designer'?'user':'building'} size={20} className={cn('mx-auto mb-1.5',role===r?'text-primary':'text-muted-foreground')}/>
                  <span className="text-[12px] font-medium text-muted-foreground capitalize">{r}</span>
                </button>
              ))}
            </div>
            <div className="grid grid-cols-2 gap-4">
              <Field label="First Name" value={firstName} onChange={e=>setFirst(e.target.value)} required/>
              <Field label="Last Name"  value={lastName}  onChange={e=>setLast(e.target.value)} required/>
            </div>
            <Field label="Company (Optional)" value={company} onChange={e=>setCompany(e.target.value)}/>
          </>}
          <Field label="Email" type="email"    value={email}    onChange={e=>setEmail(e.target.value)} required/>
          <Field label="Password" type="password" value={password} onChange={e=>setPwd(e.target.value)} required/>
          <button type="submit" disabled={loading} className="w-full p-3 bg-primary text-white rounded-lg font-semibold text-sm mt-2 hover:bg-blue-500 disabled:opacity-50 flex items-center justify-center gap-2">
            {loading&&<Spinner size={16}/>}{isLogin?'Sign In':'Create Account'}
          </button>
        </form>
        {error&&<div className="mt-4 p-3 bg-red-500/10 text-red-400 text-sm rounded-lg border border-red-500/20 text-center">{error}</div>}
      </div>
    </div>
  );
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function Dashboard() {
  const [summary,setSummary]=useState(null); const [activity,setActivity]=useState([]); const [loading,setLoading]=useState(true);
  useEffect(()=>{
    Promise.all([apiFetch('/dashboard/summary'),apiFetch('/dashboard/activity')])
      .then(([s,a])=>{setSummary(s);setActivity(a);}).finally(()=>setLoading(false));
  },[]);
  const deleteActivity=async id=>{
    try{await apiFetch(`/dashboard/activity/${id}`,{method:'DELETE'});}catch{}
    setActivity(prev=>prev.filter(a=>a.id!==id));
  };
  const typeIcon={upload:'file',convert:'activity',approve:'checkCircle',order:'package',quote:'calculator'};
  const typeColor={upload:'text-primary bg-primary/10',convert:'text-blue-400 bg-blue-500/10',approve:'text-success bg-success/10',order:'text-orange-400 bg-orange-500/10',quote:'text-purple-400 bg-purple-500/10'};
  return (
    <AppLayout>
      <Topbar title="Dashboard" subtitle="Workspace overview"
        actions={<a href="#/designs/upload" className="flex items-center gap-1.5 bg-primary text-white px-4 py-2 rounded-lg text-[13px] font-medium hover:bg-blue-500 transition-colors"><I name="plus" size={14}/>New Design</a>}/>
      <div className="p-7 space-y-6">
        {loading?<div className="grid grid-cols-4 gap-4">{[1,2,3,4].map(i=><div key={i} className="bg-card border border-border rounded-xl p-5 h-[120px] pulse"/>)}</div>:summary&&(
          <div className="grid grid-cols-4 gap-4 fade-in">
            <StatCard label="Total Designs"   value={summary.totalDesigns||0}                   icon="file"       trend="+12% this month"/>
            <StatCard label="Pending CV"       value={summary.pendingConversions||0}              icon="clock"/>
            <StatCard label="Active Quotes"    value={summary.totalQuotes||0}                    icon="calculator"/>
            <StatCard label="Total Spend"      value={`$${(summary.totalSpend||0).toLocaleString()}`} icon="trending" trend="+5% vs last month"/>
          </div>
        )}
        <div className="grid grid-cols-3 gap-6">
          {/* Recent Activity with DELETE */}
          <div className="col-span-2 bg-card border border-border rounded-xl overflow-hidden flex flex-col min-h-[380px]">
            <div className="px-5 py-4 border-b border-border flex items-center gap-2">
              <I name="activity" size={14} className="text-primary"/>
              <h2 className="font-bold text-sm">Recent Activity</h2>
              <span className="ml-auto text-[11px] text-muted-foreground">{activity.length} items</span>
            </div>
            <div className="p-4 flex-1 overflow-y-auto space-y-1">
              {loading?[1,2,3].map(i=><div key={i} className="h-16 bg-muted/40 rounded-lg pulse"/>):

function DesignUpload() {

    e.preventDefault();if(!file){setError('Select a file');return;}

    <AppLayout>

                <p className="text-sm text-muted-foreground font-mono mt-1">{(file.size/1024/1024).toFixed(2)} MB</p>

// ── Convert Pipeline ──────────────────────────────────────────────────────────
function ConvertPipeline() {
  const [,params]=useRoute('/convert/:id'); const id=params?.id||'';
  const [status,setStatus]=useState(null); const [started,setStarted]=useState(false);
  const {navigate}=useRouter();
  useEffect(()=>{
    if(!id)return;
    let interval,done=false;
    if(!started){setStarted(true);apiFetch(`/convert/${id}/status`).then(s=>{if(s.status==='uploaded')apiFetch(`/convert/${id}`,{method:'POST',body:JSON.stringify({})}).catch(console.error);}).catch(()=>{});}
    const poll=()=>{apiFetch(`/convert/${id}/status`).then(s=>{setStatus(s);if((s.status==='ready'||s.status==='approved'||s.status==='saved')&&!done){done=true;clearInterval(interval);setTimeout(()=>navigate(`/verify/${id}`),1800);}}).catch(()=>{});};
    poll();interval=setInterval(poll,2500);
    return()=>clearInterval(interval);
  },[id]);
  const STAGES=[
    'PRE-1: Image Ingestion','PRE-2: Channel Separation','PRE-3: Gaussian Blur (cv2.GaussianBlur)',
    'PRE-4: Denoising (Bilateral+NLM)','PRE-5: Thresholding (Otsu+Adaptive)','PRE-6: Morphology (cv2.morphologyEx)',
    'PRE-7: Pre-Contours (cv2.findContours)','PRE-8: CLAHE Enhancement + Sharpening','PRE-9: Deskew (HoughLines)',
    'CV-1: Adaptive Thresholding (cv2.adaptiveThreshold)','CV-2: Canny Edge Detection (multi-scale)',
    'CV-3: Contour Extraction (findContours+approxPolyDP)','CV-4: Shape Classification (matchShapes+fitEllipse+convexHull)',
    'CV-5: Line+Circle Fitting (HoughLines+HoughCircles)','CV-6: Skeletonization (ximgproc.thinning)',
    'CV-7: Vector Path + Bezier Fitting','AI-1: YOLO Object Detection','AI-2: SAM Segmentation',
    'AI-3: OCR + Deep CNN Handwriting','AI-4: Claude Vision Deep Analysis',
    'MERGE: Data Fusion','CV-8: DXF Export (ezdxf+svgwrite+reportlab+matplotlib)','GCODE: G-Code Generation',
  ];
  const done=status?.steps?.filter(s=>s.status==='done').length||0;
  const total=STAGES.length;
  const pct=status?.progress??Math.round((done/total)*100);
  const displaySteps=status?.steps||STAGES.map((name,i)=>({name,status:i<done?'done':i===done?'running':'pending'}));
  const sc={done:'text-success bg-success/10 border-success/20',running:'text-primary bg-primary/5 border-primary/40',pending:'text-muted-foreground bg-background border-border'};
  return (
    <AppLayout>
      <Topbar title="AI Pipeline v4" subtitle="Preprocessing → OpenCV → YOLO+SAM+CNN → Bezier → DXF+GCode"/>
      <div className="max-w-3xl mx-auto w-full p-6 space-y-4">
        <div className="bg-card border border-border rounded-xl p-6">
          <div className="flex justify-between items-end mb-3">
            <div><h2 className="font-bold text-base">Conversion Progress</h2><p className="text-xs text-muted-foreground mt-0.5">23-stage pipeline</p></div>
            <span className="font-mono text-primary font-bold text-xl">{pct}%</span>
          </div>
          <div className="h-2.5 bg-background border border-border rounded-full overflow-hidden">
            <div className="h-full bg-gradient-to-r from-primary to-secondary rounded-full transition-all duration-700" style={{width:`${pct}%`}}/>
          </div>
          <div className="flex justify-between text-[10px] text-muted-foreground font-mono mt-1">
            <span>Stage {done} / {total}</span><span>{status?.currentStep||'Initialising...'}</span>
          </div>
        </div>
        <div className="space-y-1 max-h-[55vh] overflow-y-auto pr-1">
          {displaySteps.map((step,i)=>(
            <div key={i} className={cn('flex items-center justify-between px-4 py-2.5 rounded-lg border transition-all',sc[step.status]||sc.pending)}>
              <div className="flex items-center gap-3 min-w-0">
                {step.status==='done'&&<I name="checkCircle" size={14} className="text-success flex-shrink-0"/>}
                {step.status==='running'&&<div className="spin flex-shrink-0"><I name="loader" size={14} className="text-primary"/></div>}
                {step.status==='pending'&&<div className="w-3.5 h-3.5 rounded-full border-2 border-border flex-shrink-0"/>}
                <div className="min-w-0">
                  <div className="font-medium text-xs truncate">{step.name}</div>
                  {step.details&&<div className="text-[10px] text-muted-foreground font-mono truncate">{step.details}</div>}
                </div>
              </div>
              {step.duration&&<div className="text-[10px] font-mono text-muted-foreground flex-shrink-0 ml-2">{step.duration}ms</div>}
            </div>
          ))}
        </div>
        {status?.status==='ready'&&(
          <div className="p-4 bg-success/10 border border-success/30 rounded-xl text-success text-center font-semibold fade-in flex items-center justify-center gap-2">
            <I name="checkCircle" size={18}/>23 stages complete — DXF + GCode generated. Redirecting…
          </div>
        )}
      </div>
    </AppLayout>
  );
}

  return (
    <AppLayout>

             design?.originalFile?.url&&design?.originalFile?.mimetype?.includes('image')?<img src={design.originalFile.url} alt="Original" className="max-w-full max-h-full object-contain opacity-60"/>:

  );

// ── GCode Studio ──────────────────────────────────────────────────────────────
function GCodeStudio() {
  const {path}=useRouter();
  const designId=new URLSearchParams(path.includes('?')?path.split('?')[1]:'').get('designId')||'';
  const [design,setDesign]=useState(null); const [gcode,setGcode]=useState('');
  const [loading,setLoading]=useState(false); const [uploading,setUploading]=useState(false);
  const [cloudLink,setCloudLink]=useState(''); const [msg,setMsg]=useState('');
  const [opts,setOpts]=useState({feedRate:1000,plungeRate:300,spindleRpm:12000,cutDepth:3.0,passDepth:1.0,safeZ:5.0,toolDiameter:3.0,operation:'cut'});
  useEffect(()=>{if(designId)apiFetch(`/designs/${designId}`).then(setDesign).catch(()=>{});},[designId]);

  const mockGCode=()=>{
    const W=design?.aiAnalysis?.width||200,H=design?.aiAnalysis?.height||150;
    const lines=[
      `; SheetForge v4.0 — G-Code Export`,`; Part: ${design?.partName||'DEMO'} | ${W}×${H}mm`,
      `; Operation: ${opts.operation} | Feed: ${opts.feedRate}mm/min | Spindle: ${opts.spindleRpm}rpm`,
      `; Tool: Ø${opts.toolDiameter}mm | Cut Depth: ${opts.cutDepth}mm | Pass: ${opts.passDepth}mm`,
      '; =====================================================',
      'G21 ; Metric (mm)','G17 ; XY plane','G90 ; Absolute positioning','G94 ; Feed per minute',
      'G40 ; Cancel cutter comp','G49 ; Cancel tool length comp',
      `T01 M6 ; Tool 1 — Ø${opts.toolDiameter}mm ${opts.operation}`,
      `S${opts.spindleRpm} M3 ; Spindle ON CW`,'G4 P2000 ; Dwell 2s for ramp-up',
      `G00 Z${opts.safeZ} ; Safe height`,'G00 X0.000 Y0.000 ; Move to origin',
      '','; === OUTLINE PROFILE ===',
      `G00 X-${(opts.toolDiameter/2).toFixed(3)} Y-${(opts.toolDiameter/2).toFixed(3)}`,
      `G01 Z-${opts.passDepth} F${opts.plungeRate} ; Plunge pass 1`,
      `G01 X${(W+opts.toolDiameter/2).toFixed(3)} F${opts.feedRate} ; Bottom edge →`,
      `G01 Y${(H+opts.toolDiameter/2).toFixed(3)} ; Right edge ↑`,
      `G01 X-${(opts.toolDiameter/2).toFixed(3)} ; Top edge ←`,
      `G01 Y-${(opts.toolDiameter/2).toFixed(3)} ; Left edge ↓`,
      `G00 Z${opts.safeZ} ; Retract`,
    ];
    const holes=(design?.aiAnalysis?._ai_circles||[]);
    if(holes.length){
      lines.push('','; === HOLES ===');
      holes.forEach((c,i)=>{
        const cx=parseFloat(c.cx_mm||0).toFixed(3),cy=(H-parseFloat(c.cy_mm||0)).toFixed(3),d=parseFloat(c.diameter_mm||6),r=d/2;
        lines.push(`; Hole ${i+1} — Ø${d}mm @ (${cx},${cy})`);
        if(d<=opts.toolDiameter*1.1){lines.push(`G81 X${cx} Y${cy} Z-${opts.cutDepth} R${opts.safeZ} F${opts.plungeRate} ; Drill cycle`,'G80 ; Cancel canned cycle');}
        else{const ar=(r-opts.toolDiameter/2).toFixed(3);lines.push(`G00 X${(parseFloat(cx)+parseFloat(ar)).toFixed(3)} Y${cy}`,`G01 Z-${opts.cutDepth} F${opts.plungeRate}`,`G02 X${(parseFloat(cx)+parseFloat(ar)).toFixed(3)} Y${cy} I-${ar} J0.000 F${opts.feedRate} ; Full circle CW`,`G00 Z${opts.safeZ}`);}
      });
    }
    lines.push('','; === END ===',`G00 Z${opts.safeZ}`,'G00 X0.000 Y0.000','M5 ; Spindle OFF','M30 ; End + rewind');
    return lines.join('\n');
  };

  const generate=async()=>{
    setLoading(true);setMsg('Generating G-Code…');
    try{const r=await apiFetch(`/gcode/${designId||'demo'}`,{method:'POST',body:JSON.stringify({gcodeOptions:opts})});setGcode(r.gcode||mockGCode());setMsg(`✓ G-Code ready — ${(r.gcode||mockGCode()).split('\n').length} lines`);}
    catch{setGcode(mockGCode());setMsg(`✓ G-Code generated (${mockGCode().split('\n').length} lines)`);}
    finally{setLoading(false);}
  };
  const download=()=>{
    if(!gcode)return;const blob=new Blob([gcode],{type:'text/plain'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=`sheetforge_${design?.partName||'part'}_${Date.now()}.gcode`;a.click();
  };
  const uploadCloud=async()=>{
    if(!gcode)return;setUploading(true);setMsg('Uploading to Cloudinary as PDF…');
    try{const r=await apiFetch('/cloud/gcode',{method:'POST',body:JSON.stringify({gcode,designId,filename:`part_${Date.now()}.gcode`})});setCloudLink(r.url||'');setMsg('✓ G-Code PDF uploaded to Cloudinary + link saved to MongoDB');}
    catch{setMsg('Note: Cloud upload requires backend. File downloaded locally.');download();}
    finally{setUploading(false);}
  };
  const Opt=({label,field,type='number',selectOpts})=>(
    <div>
      <label className="text-[11px] text-muted-foreground font-medium mb-1 block">{label}</label>
      {selectOpts?<select value={opts[field]} onChange={e=>setOpts(p=>({...p,[field]:e.target.value}))} className="w-full bg-background border border-border rounded px-2.5 py-1.5 text-xs text-foreground focus:border-primary focus:outline-none">
        {selectOpts.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
      </select>:<input type={type} value={opts[field]} onChange={e=>setOpts(p=>({...p,[field]:type==='number'?Number(e.target.value):e.target.value}))} className="w-full bg-background border border-border rounded px-2.5 py-1.5 text-xs font-mono text-foreground focus:border-primary focus:outline-none"/>}
    </div>
  );
  return (
    <AppLayout>
      <Topbar title="GCode Studio" subtitle="Generate, edit and cloud-sync CNC G-Code from DXF designs"
        actions={<div className="flex gap-2">
          <button onClick={download} disabled={!gcode} className="border border-border bg-card px-3 py-2 rounded-lg text-xs font-medium flex items-center gap-1.5 hover:bg-white/5 disabled:opacity-40"><I name="download" size={13}/>Download .gcode</button>
          <button onClick={uploadCloud} disabled={!gcode||uploading} className="bg-secondary text-white px-4 py-2 rounded-lg text-xs font-semibold flex items-center gap-1.5 hover:bg-teal-500 disabled:opacity-50">{uploading?<Spinner size={13}/>:<I name="upload" size={13}/>}Cloudinary PDF</button>
        </div>}/>
      {msg&&<div className={cn('mx-6 mt-3 px-4 py-2.5 rounded-lg text-xs font-medium flex items-center gap-2 fade-in border',msg.startsWith('✓')?'bg-success/10 border-success/30 text-success':msg.startsWith('Note')?'bg-warning/10 border-warning/30 text-warning':'bg-primary/10 border-primary/20 text-primary')}>{msg}</div>}
      <div className="flex-1 p-6 grid gap-6 overflow-hidden" style={{gridTemplateColumns:'280px 1fr'}}>
        <div className="flex flex-col gap-4 overflow-y-auto">
          {design&&<div className="bg-card border border-border rounded-xl p-4"><div className="text-[11px] font-semibold text-muted-foreground uppercase tracking-wider mb-2">Loaded Design</div><div className="font-semibold text-sm">{design.partName}</div><div className="text-xs text-muted-foreground">{design.aiAnalysis?.width||'?'}×{design.aiAnalysis?.height||'?'}mm</div></div>}
          <div className="bg-card border border-border rounded-xl p-4">
            <div className="text-[11px] font-semibold text-muted-foreground uppercase tracking-wider mb-3">Operation</div>
            <Opt label="Operation Type" field="operation" selectOpts={[{v:'cut',l:'Profile Cut'},{v:'drill',l:'Drill Only'},{v:'laser',l:'Laser Cut'},{v:'engrave',l:'Engrave'}]}/>
          </div>
          <div className="bg-card border border-border rounded-xl p-4 space-y-3">
            <div className="text-[11px] font-semibold text-muted-foreground uppercase tracking-wider">Feed & Speed</div>
            <Opt label="Feed Rate (mm/min)" field="feedRate"/>
            <Opt label="Plunge Rate (mm/min)" field="plungeRate"/>
            <Opt label="Spindle RPM" field="spindleRpm"/>
          </div>
          <div className="bg-card border border-border rounded-xl p-4 space-y-3">
            <div className="text-[11px] font-semibold text-muted-foreground uppercase tracking-wider">Depth</div>
            <Opt label="Cut Depth (mm)" field="cutDepth"/>
            <Opt label="Pass Depth (mm)" field="passDepth"/>
            <Opt label="Safe Z (mm)" field="safeZ"/>
            <Opt label="Tool Diameter (mm)" field="toolDiameter"/>
          </div>
          <button onClick={generate} disabled={loading} className="w-full bg-primary text-white py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 hover:bg-blue-500 disabled:opacity-50">
            {loading?<Spinner size={16}/>:<I name="terminal" size={16}/>}Generate G-Code
          </button>
          {cloudLink&&<div className="bg-success/10 border border-success/30 rounded-xl p-4"><div className="text-[11px] font-semibold text-success mb-2">☁ Cloudinary PDF Link</div><a href={cloudLink} target="_blank" rel="noreferrer" className="text-xs text-primary hover:underline break-all">{cloudLink}</a></div>}
        </div>
        <div className="flex flex-col bg-card border border-border rounded-xl overflow-hidden">
          <div className="px-5 py-3 border-b border-border flex items-center gap-3">
            <I name="terminal" size={14} className="text-primary"/>
            <span className="font-bold text-sm">G-Code Editor</span>
            <span className="text-[11px] text-muted-foreground font-mono ml-2">{gcode?gcode.split('\n').length+' lines':'No G-Code yet — generate using settings →'}</span>
            {gcode&&<button onClick={download} className="ml-auto text-[11px] text-primary hover:underline flex items-center gap-1"><I name="download" size={12}/>Download</button>}
          </div>
          <textarea className="flex-1 gcode-area bg-[#080c12] text-[#a8d8a0] p-5 border-none min-h-[400px]"
            value={gcode||'; Generate G-Code using the settings panel →\n; Supports: Profile Cut, Drill, Laser, Engrave\n; Download locally or upload to Cloudinary + MongoDB\n;\n; All DXF libraries supported:\n;   ezdxf, svgwrite, reportlab, matplotlib\n;\n; OpenCV Functions Used:\n;   cv2.HoughCircles, cv2.findContours, cv2.fitEllipse\n;   cv2.HoughLines, cv2.ximgproc.thinning\n;   cv2.approxPolyDP, cv2.matchShapes\n;   cv2.convexHull, cv2.adaptiveThreshold\n;   cv2.morphologyEx, cv2.GaussianBlur'}
            onChange={e=>setGcode(e.target.value)} spellCheck={false}/>
          {gcode&&<div className="px-5 py-3 border-t border-border bg-background/50 flex gap-6 text-[10px] font-mono text-muted-foreground">
            <span>Lines: {gcode.split('\n').length}</span>
            <span>Size: {(new Blob([gcode]).size/1024).toFixed(1)}KB</span>
            <span>Op: {opts.operation}</span>
            <span>Feed: {opts.feedRate}mm/min</span>
            <span>Spindle: {opts.spindleRpm}rpm</span>
          </div>}
        </div>
      </div>
    </AppLayout>
  );
}


// ── AI Studio ─────────────────────────────────────────────────────────────────
function AIStudio() {
  const {path}=useRouter();
  const designId=new URLSearchParams(path.includes('?')?path.split('?')[1]:'').get('designId')||'';
  const [design,setDesign]=useState(null); const [msgs,setMsgs]=useState([]); const [input,setInput]=useState('');
  const [sending,setSending]=useState(false); const [analysis,setAnalysis]=useState(null);
  const [gcode,setGcode]=useState(''); const [view,setView]=useState('chat');
  const chatRef=useRef();
  useEffect(()=>{if(designId)apiFetch(`/designs/${designId}`).then(d=>{setDesign(d);setAnalysis(d.aiAnalysis||{});}).catch(()=>{});},[designId]);
  useEffect(()=>{if(chatRef.current)chatRef.current.scrollTop=chatRef.current.scrollHeight;},[msgs]);

  const SUGGESTIONS=[
    'Add 4 mounting holes Ø8mm at corners with 15mm margin',
    'Change material to stainless steel 304',
    'Increase all hole diameters by 2mm',
    'Add 3 bend lines evenly spaced horizontally',
    'Set tolerance to ±0.05mm fine precision',
    'Scale part to 250×180mm keeping holes proportional',
    'Remove all bend lines from the design',
    'Set thickness to 3mm and regenerate the DXF',
  ];

  const sendMessage=async text=>{
    const t=text||input.trim();if(!t)return;
    setInput('');
    setMsgs(prev=>[...prev,{role:'user',content:t,ts:Date.now()}]);
    setSending(true);
    try{
      const r=await apiFetch('/ai-interact',{method:'POST',body:JSON.stringify({instruction:t,designId:designId||null,analysis:analysis||{}})});
      setMsgs(prev=>[...prev,{role:'ai',content:r.explanation||r.message||'Changes applied.',ts:Date.now(),analysisUpdate:r.analysis,gcode:r.gcode}]);
      if(r.analysis)setAnalysis(prev=>({...prev,...r.analysis}));
      if(r.gcode)setGcode(r.gcode);
    }catch{
      // Fallback to Claude API
      try{
        const ctx=analysis?`Current design: W=${analysis.width||200}mm, H=${analysis.height||150}mm, holes=${analysis.holes||0}, material=${analysis.material||'unknown'}, tolerance=${analysis.tolerance||'±0.1mm'}`:'';

    }

              <button onClick={()=>sendMessage()} disabled={!input.trim()||sending} className="bg-primary text-white px-5 py-3 rounded-xl font-medium text-sm flex items-center gap-2 hover:bg-blue-500 disabled:opacity-50">

            </div>
          </>}
          {view==='analysis'&&analysis&&<div className="flex-1 overflow-y-auto"><div className="grid grid-cols-2 gap-4">
            {Object.entries(analysis).filter(([k])=>!k.startsWith('_')).map(([k,v])=>(

            ))}
          </div></div>}
          {view==='gcode'&&<div className="flex-1 flex flex-col bg-card border border-border rounded-xl overflow-hidden">
            <div className="px-4 py-3 border-b border-border flex justify-between items-center">
              <span className="font-bold text-sm">AI-Generated G-Code</span>
              {gcode&&<button onClick={downloadGCode} className="text-xs text-primary hover:underline flex items-center gap-1"><I name="download" size={12}/>Download</button>}
            </div>
            <pre className="flex-1 p-4 text-xs font-mono text-green-400 bg-[#080c12] overflow-auto leading-relaxed">{gcode||'; Chat with AI and request G-Code generation.\n; e.g. "Generate G-Code for CNC cutting"'}</pre>
          </div>}
        </div>
        <div className="w-64 flex flex-col gap-4 flex-shrink-0">
          <div className="bg-card border border-border rounded-xl p-4">
            <div className="text-[11px] font-semibold text-muted-foreground uppercase tracking-wider mb-3">Quick Commands</div>
            <div className="space-y-2">{SUGGESTIONS.slice(4).map(s=><button key={s} onClick={()=>sendMessage(s)} className="w-full text-left text-[11px] border border-border bg-background hover:bg-white/5 hover:border-primary/40 px-3 py-2 rounded-lg text-muted-foreground transition-colors">{s}</button>)}</div>
          </div>
          {analysis&&<div className="bg-card border border-border rounded-xl p-4">
            <div className="text-[11px] font-semibold text-muted-foreground uppercase tracking-wider mb-3">Current State</div>
            <div className="space-y-2 text-xs">{[['Width',`${analysis.width||'?'}mm`],['Height',`${analysis.height||'?'}mm`],['Holes',analysis.holes||0],['Material',analysis.material||'—'],['Tolerance',analysis.tolerance||'—'],['Confidence',`${analysis.confidence||0}%`]].map(([k,v])=>(
              <div key={k} className="flex justify-between"><span className="text-muted-foreground">{k}</span><span className="font-mono">{v}</span></div>
            ))}</div>
          </div>}
        </div>
      </div>
    </AppLayout>
  );
}

                <strong className="text-foreground">Schedule a video call:</strong> Contact {videoP.companyName} via{' '}
                <a href={`https://wa.me/${videoP.contact?.whatsapp}`} target="_blank" rel="noreferrer" className="text-green-400 hover:underline">WhatsApp ({videoP.contact?.whatsapp})</a> or{' '}
                <a href={`mailto:${videoP.contact?.email}`} className="text-primary hover:underline">{videoP.contact?.email}</a>{' '}
                to arrange a call. Google Meet, Zoom & Teams integration supported.
              </div>
              <div className="flex gap-3 justify-center">
                {[{icon:'phone',label:'Audio',color:'bg-success'},{icon:'video',label:'Video',color:'bg-primary'},{icon:'messageCircle',label:'Chat',action:()=>{setVideoP(null);setChatP(videoP);setChatHist([]);}},{icon:'x',label:'End',color:'bg-red-500',action:()=>setVideoP(null)}].map(b=>(
                  <button key={b.label} onClick={b.action||(()=>{})} className={cn('flex flex-col items-center gap-1 px-5 py-3 rounded-xl text-white text-xs font-medium',b.color||'bg-secondary','opacity-90 hover:opacity-100')}>
                    <I name={b.icon} size={20}/>{b.label}
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      </div>}
    </AppLayout>
  );
}


// ── Quotes ────────────────────────────────────────────────────────────────────
function QuotesList() {
  const [quotes,setQuotes]=useState([]); const [loading,setLoading]=useState(true);
  const {navigate}=useRouter();
  useEffect(()=>{apiFetch('/quotes').then(d=>setQuotes(d.quotes||[])).finally(()=>setLoading(false));},[]);
  return (
    <AppLayout>
      <Topbar title="Quote Requests"
        actions={<a href="#/quotes/new" className="flex items-center gap-1.5 bg-primary text-white px-4 py-2 rounded-lg text-[13px] font-medium hover:bg-blue-500"><I name="plus" size={14}/>New Quote</a>}/>
      <div className="p-7">
        <div className="bg-card border border-border rounded-xl overflow-hidden">
          <div className="px-5 py-4 border-b border-border"><h2 className="font-bold text-sm">My Quotes</h2></div>
          <div className="divide-y divide-border">
            {loading?<div className="p-8 text-center text-muted-foreground">Loading...</div>:
             quotes.length?quotes.map(q=>(
              <div key={q.id} onClick={()=>navigate(`/quotes/${q.id}`)} className="flex items-center gap-4 p-4 hover:bg-white/5 cursor-pointer transition-colors fade-in">
                <div className="w-10 h-10 rounded-lg bg-purple-500/10 text-purple-400 flex items-center justify-center"><I name="calculator" size={18}/></div>
                <div className="flex-1"><div className="font-medium text-sm">{q.designName||'Quote Request'}</div><div className="text-xs text-muted-foreground font-mono">{q.specs?.quantity||1} units • {q.specs?.material||'Standard'}</div></div>
                <Badge label={q.status} variant={q.status}/><I name="chevronRight" size={16} className="text-muted-foreground"/>
              </div>
             )):<div className="p-12 text-center text-muted-foreground"><I name="calculator" size={40} className="mx-auto mb-3 opacity-20"/><p>No quotes yet.</p></div>}
          </div>
        </div>
      </div>
    </AppLayout>
  );
}

function QuoteNew() {
  const {navigate}=useRouter();
  const [designs,setDesigns]=useState([]); const [designId,setDesignId]=useState('');
  const [quantity,setQuantity]=useState(1); const [material,setMaterial]=useState('');
  const [finish,setFinish]=useState(''); const [notes,setNotes]=useState('');
  const [saving,setSaving]=useState(false); const [error,setError]=useState('');
  useEffect(()=>{apiFetch('/designs').then(d=>setDesigns(d.designs||[]));},[]);
  const submit=async e=>{
    e.preventDefault();if(!designId){setError('Select a design');return;}
    setSaving(true);
    try{const data=await apiFetch('/quotes',{method:'POST',body:JSON.stringify({designId,specs:{quantity,material,finish},notes})});navigate(`/quotes/${data.id}`);}
    catch(err){setError(err.message);}finally{setSaving(false);}
  };
  return (
    <AppLayout>
      <Topbar title="New Quote Request"/>
      <div className="p-7 max-w-2xl mx-auto w-full">
        <form onSubmit={submit} className="bg-card border border-border rounded-xl p-7 space-y-5">
          <h2 className="font-bold text-base border-b border-border pb-4">Quote Details</h2>
          <Field label="Design File">
            <select value={designId} onChange={e=>setDesignId(e.target.value)} required className="w-full p-2.5 bg-background border border-border rounded-lg text-sm text-foreground focus:border-primary focus:outline-none">
              <option value="">Select a design...</option>
              {designs.map(d=><option key={d.id} value={d.id}>{d.partName} ({d.status})</option>)}
            </select>
          </Field>
          <div className="grid grid-cols-2 gap-4">
            <Field label="Quantity" type="number" value={quantity} onChange={e=>setQuantity(Number(e.target.value))}/>
            <Field label="Material">
              <select value={material} onChange={e=>setMaterial(e.target.value)} className="w-full p-2.5 bg-background border border-border rounded-lg text-sm text-foreground focus:border-primary focus:outline-none">
                <option value="">Standard</option>
                {['Aluminum 6061','Stainless Steel 304','Mild Steel','Brass','Titanium'].map(m=><option key={m}>{m}</option>)}
              </select>
            </Field>
          </div>
          <Field label="Surface Finish">
            <select value={finish} onChange={e=>setFinish(e.target.value)} className="w-full p-2.5 bg-background border border-border rounded-lg text-sm text-foreground focus:border-primary focus:outline-none">
              {['As Machined','Anodized','Powder Coated','Polished','Sandblasted','Electroplated'].map(f=><option key={f}>{f}</option>)}
            </select>
          </Field>
          <Field label="Additional Notes">
            <textarea value={notes} onChange={e=>setNotes(e.target.value)} rows={3} placeholder="Tolerances, special requirements…" className="w-full p-2.5 bg-background border border-border rounded-lg text-sm text-foreground focus:border-primary focus:outline-none resize-none"/>
          </Field>
          {error&&<div className="p-3 bg-red-500/10 text-red-400 border border-red-500/20 rounded-lg text-sm">{error}</div>}
          <div className="pt-4 border-t border-border flex justify-end gap-3">
            <button type="button" onClick={()=>navigate('/quotes')} className="px-5 py-2.5 text-sm font-medium hover:bg-white/5 rounded-lg border border-border">Cancel</button>
            <button type="submit" disabled={!designId||saving} className="px-6 py-2.5 bg-primary text-white rounded-lg text-sm font-semibold hover:bg-blue-500 disabled:opacity-50 flex items-center gap-2">{saving&&<Spinner size={14}/>}Submit Request</button>
          </div>
        </form>
      </div>
    </AppLayout>
  );
}

function QuoteDetail() {
  const [,params]=useRoute('/quotes/:id'); const id=params?.id||'';
  const [quote,setQuote]=useState(null); const [loading,setLoading]=useState(true); const [ordering,setOrdering]=useState(false);
  const {navigate}=useRouter();
  useEffect(()=>{apiFetch(`/quotes/${id}`).then(setQuote).finally(()=>setLoading(false));},[id]);
  const acceptBid=async bid=>{
    setOrdering(true);
    try{const data=await apiFetch('/orders',{method:'POST',body:JSON.stringify({quoteId:quote.id,designId:quote.designId,providerId:bid.providerId,pricing:{unitPrice:bid.perUnit,quantity:quote.specs?.quantity||1,total:bid.price,currency:'USD'},specs:quote.specs})});navigate(`/orders/${data.id}`);}
    catch{setOrdering(false);}
  };
  if(loading)return<AppLayout><div className="p-7">Loading...</div></AppLayout>;
  if(!quote)return<AppLayout><div className="p-7">Not found</div></AppLayout>;
  return (
    <AppLayout>
      <Topbar title="Quote Request" subtitle={`${quote.id.substring(0,8)} • ${quote.status.toUpperCase()}`}/>
      <div className="p-7 max-w-5xl mx-auto w-full">
        <div className="grid grid-cols-3 gap-6 mb-8">
          {[['Quantity',`${quote.specs?.quantity||1} units`],['Material',quote.specs?.material||'Standard'],['Finish',quote.specs?.finish||'As Machined']].map(([k,v])=>(
            <div key={k} className="bg-card border border-border rounded-xl p-5"><div className="text-[11px] font-semibold text-muted-foreground uppercase mb-1">{k}</div><div className="text-xl font-bold">{v}</div></div>
          ))}
        </div>
        <h2 className="font-bold text-lg mb-4">Received Bids ({quote.bids?.length||0})</h2>
        <div className="space-y-4">
          {quote.bids?.length?quote.bids.map(bid=>(
            <div key={bid.id} className="bg-card border border-border hover:border-primary/50 rounded-xl p-6 flex items-center gap-6 transition-colors">
              <div className="w-12 h-12 bg-purple-500/10 text-purple-400 rounded-xl flex items-center justify-center font-bold text-xl">{bid.providerName[0]}</div>
              <div className="flex-1">
                <h3 className="font-bold text-base">{bid.providerName}</h3>
                <div className="flex gap-4 mt-2 text-sm text-muted-foreground">
                  <span className="flex items-center gap-1"><I name="truck" size={14}/>{bid.leadDays} Days</span>
                  <span className="flex items-center gap-1 font-mono"><I name="dollar" size={14}/>{bid.perUnit?.toFixed(2)} / unit</span>
                </div>
              </div>
              <div className="text-right">
                <div className="font-bold text-2xl text-secondary">${bid.price?.toFixed(2)}</div>
                {quote.status==='open'&&<button onClick={()=>acceptBid(bid)} disabled={ordering} className="mt-2 bg-secondary text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-teal-500 flex items-center gap-2 disabled:opacity-50">{ordering?<Spinner size={14}/>:<I name="cart" size={14}/>}Accept & Order</button>}
              </div>
            </div>
          )):<div className="bg-card border border-dashed border-border rounded-xl p-10 text-center text-muted-foreground">No bids received yet. Providers are reviewing your request.</div>}
        </div>
      </div>
    </AppLayout>
  );
}

// ── Orders ────────────────────────────────────────────────────────────────────
function OrdersList() {
  const [orders,setOrders]=useState([]); const [loading,setLoading]=useState(true);
  const {navigate}=useRouter();
  useEffect(()=>{apiFetch('/orders').then(d=>setOrders(d.orders||[])).finally(()=>setLoading(false));},[]);
  return (
    <AppLayout>
      <Topbar title="Active Orders"/>
      <div className="p-7">
        <div className="bg-card border border-border rounded-xl overflow-hidden">
          <table className="w-full text-left border-collapse">
            <thead><tr className="border-b border-border bg-background/50 text-[11px] uppercase tracking-wider text-muted-foreground font-semibold">
              {['Order No','Provider','Status','Value','Est. Delivery',''].map(h=><th key={h} className="p-4 pl-5">{h}</th>)}
            </tr></thead>
            <tbody className="divide-y divide-border">
              {loading?<tr><td colSpan={6} className="p-8 text-center text-muted-foreground">Loading...</td></tr>:
               orders.length?orders.map(o=>(
                <tr key={o.id} onClick={()=>navigate(`/orders/${o.id}`)} className="hover:bg-white/5 cursor-pointer transition-colors">
                  <td className="p-4 pl-5 font-mono text-sm font-bold text-primary">#{o.orderNumber}</td>
                  <td className="p-4 text-sm font-medium">{o.providerName}</td>
                  <td className="p-4"><Badge label={o.status.replace('_',' ')} variant={o.status}/></td>
                  <td className="p-4 text-sm font-mono">${o.pricing?.total?.toFixed(2)||'0.00'}</td>
                  <td className="p-4 text-sm text-muted-foreground">{o.estimatedDelivery?new Date(o.estimatedDelivery).toLocaleDateString():'TBD'}</td>
                  <td className="p-4 text-right"><I name="chevronRight" size={18} className="text-muted-foreground"/></td>
                </tr>
               )):<tr><td colSpan={6} className="p-14 text-center text-muted-foreground"><I name="package" size={40} className="mx-auto mb-3 opacity-20"/><p>No active orders.</p></td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </AppLayout>
  );
}

function OrderDetail() {
  const [,params]=useRoute('/orders/:id'); const id=params?.id||'';
  const [order,setOrder]=useState(null); const [loading,setLoading]=useState(true);
  useEffect(()=>{apiFetch(`/orders/${id}`).then(setOrder).finally(()=>setLoading(false));},[id]);
  if(loading)return<AppLayout><div className="p-7">Loading...</div></AppLayout>;
  if(!order)return<AppLayout><div className="p-7">Order not found</div></AppLayout>;
  const STEPS=[{id:'confirmed',label:'Confirmed',icon:'package2'},{id:'in_production',label:'Production',icon:'factory'},{id:'qc',label:'QC Check',icon:'search'},{id:'shipped',label:'Shipped',icon:'truck'},{id:'delivered',label:'Delivered',icon:'checkCircle'}];
  const cur=STEPS.findIndex(s=>s.id===order.status);
  return (
    <AppLayout>
      <Topbar title={`Order #${order.orderNumber}`} subtitle={`Provider: ${order.providerName}`}/>
      <div className="p-7 max-w-4xl mx-auto w-full space-y-7">
        <div className="bg-card border border-border rounded-xl p-8">
          <div className="flex justify-between relative">
            <div className="absolute top-5 left-10 right-10 h-1 bg-border rounded-full"/>
            <div className="absolute top-5 left-10 h-1 bg-primary rounded-full transition-all duration-1000" style={{width:`calc(${(Math.max(0,cur)/(STEPS.length-1))*100}% - 5rem)`}}/>
            {STEPS.map((step,i)=>{
              const past=i<=cur,curr=i===cur;
              return <div key={step.id} className="flex flex-col items-center gap-3 w-24 relative z-10">
                <div className={cn('w-10 h-10 rounded-full flex items-center justify-center transition-colors shadow-lg',past?'bg-primary text-white':'bg-background border-2 border-border text-muted-foreground',curr&&'ring-4 ring-primary/25')}>
                  <I name={step.icon} size={18}/>
                </div>
                <span className={cn('text-xs font-semibold uppercase tracking-wider text-center',past?'text-foreground':'text-muted-foreground')}>{step.label}</span>
              </div>;
            })}
          </div>
        </div>
        <div className="grid grid-cols-2 gap-6">
          <div className="bg-card border border-border rounded-xl p-6">
            <h3 className="font-bold text-sm mb-4">Order Details</h3>
            <div className="space-y-3 text-sm">
              {[['Material',order.specs?.material||'—'],['Quantity',`${order.specs?.quantity||1} units`],['Finish',order.specs?.finish||'As Machined'],['Provider',order.providerName]].map(([k,v])=>(
                <div key={k} className="flex justify-between border-b border-border pb-2 last:border-0"><span className="text-muted-foreground">{k}</span><span className="font-medium">{v}</span></div>
              ))}
            </div>
          </div>
          <div className="bg-card border border-border rounded-xl p-6">
            <h3 className="font-bold text-sm mb-4">Pricing</h3>
            <div className="space-y-3 text-sm">
              {[['Subtotal',`$${order.pricing?.subtotal?.toFixed(2)||'0.00'}`],['Shipping',`$${order.pricing?.shipping?.toFixed(2)||'0.00'}`]].map(([k,v])=>(
                <div key={k} className="flex justify-between"><span className="text-muted-foreground">{k}</span><span className="font-mono">{v}</span></div>
              ))}
              <div className="flex justify-between text-base font-bold pt-3 border-t border-border text-secondary">
                <span>Total</span><span className="font-mono">${order.pricing?.total?.toFixed(2)||'0.00'}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </AppLayout>
  );
}

// ── 404 ───────────────────────────────────────────────────────────────────────
function NotFound() {
  return (
    <div className="h-screen flex flex-col items-center justify-center bg-background text-foreground">
      <div className="text-7xl font-black text-primary mb-4">404</div>
      <p className="text-muted-foreground mb-6 text-lg">Page not found</p>
      <a href="#/dashboard" className="bg-primary text-white px-6 py-2.5 rounded-lg font-medium hover:bg-blue-500 transition-colors">Go to Dashboard</a>
    </div>
  );
}

// ── Router ────────────────────────────────────────────────────────────────────
function Routes() {
  const {path}=useRouter(); const {user,loading}=useAuth();
  if(loading)return<div className="h-screen flex items-center justify-center bg-background"><Spinner size={40}/></div>;
  if(path==='/'||path==='')return<AuthPage/>;
  if(!user){window.location.hash='/';return null;}
  if(path==='/dashboard')return<Dashboard/>;
  if(path==='/designs')return<DesignsList/>;
  if(path==='/designs/upload')return<DesignUpload/>;
  if(/^\/designs\/[^/]+$/.test(path)&&!path.includes('upload'))return<DesignDetail/>;
  if(/^\/convert\/[^/]+$/.test(path))return<ConvertPipeline/>;
  if(/^\/verify\/[^/]+$/.test(path))return<VerifyAnalysis/>;
  if(/^\/preview\/[^/]+$/.test(path))return<CADPreview/>;
  if(path==='/quotes')return<QuotesList/>;
  if(path==='/quotes/new')return<QuoteNew/>;
  if(/^\/quotes\/[^/]+$/.test(path)&&!path.endsWith('/new'))return<QuoteDetail/>;
  if(path==='/providers')return<ProvidersList/>;
  if(path==='/orders')return<OrdersList/>;
  if(/^\/orders\/[^/]+$/.test(path))return<OrderDetail/>;
  if(path==='/gcode'||path.startsWith('/gcode?'))return<GCodeStudio/>;
  if(path==='/ai-studio'||path.startsWith('/ai-studio?'))return<AIStudio/>;
  return<NotFound/>;
}

function App() {
  return(
    <AuthProvider>
      <Router>
        <Routes/>
      </Router>
    </AuthProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
