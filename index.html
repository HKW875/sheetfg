<script type="text/babel" data-presets="react">
const { useState, useEffect, useContext, createContext, useRef, useCallback } = React;

// ─── API client ───────────────────────────────────────────────────────────────
const BASE = 'https://sheetbackend-9rpx.onrender.com/api';

async function apiFetch(path, opts = {}) {
  const token = localStorage.getItem('sheetforge_token');
  const headers = { ...(opts.headers || {}) };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  if (!(opts.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  const res = await fetch(`${BASE}${path}`, { ...opts, headers });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(err.error || 'Request failed');
  }
  return res.json();
}

// ─── Auth context ─────────────────────────────────────────────────────────────
const AuthCtx = createContext(null);
function AuthProvider({ children }) {
  const [user, setUser]       = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const token = localStorage.getItem('sheetforge_token');
    if (!token) { setLoading(false); return; }
    apiFetch('/auth/me')
      .then(u => setUser(u))
      .catch(() => localStorage.removeItem('sheetforge_token'))
      .finally(() => setLoading(false));
  }, []);

  const login = (token, userData) => {
    localStorage.setItem('sheetforge_token', token);
    setUser(userData);
  };
  const logout = () => {
    localStorage.removeItem('sheetforge_token');
    setUser(null);
  };

  return <AuthCtx.Provider value={{ user, loading, login, logout }}>{children}</AuthCtx.Provider>;
}
const useAuth = () => useContext(AuthCtx);

// ─── Router (hash-based) ──────────────────────────────────────────────────────
const RouterCtx = createContext(null);
function Router({ children }) {
  const [path, setPath] = useState(window.location.hash.slice(1) || '/');
  useEffect(() => {
    const handler = () => setPath(window.location.hash.slice(1) || '/');
    window.addEventListener('hashchange', handler);
    return () => window.removeEventListener('hashchange', handler);
  }, []);
  const navigate = useCallback(p => { window.location.hash = p; }, []);
  return <RouterCtx.Provider value={{ path, navigate }}>{children}</RouterCtx.Provider>;
}
function useRouter() { return useContext(RouterCtx); }
function Link({ href, children, className, onClick }) {
  const { navigate } = useRouter();
  return <a href={`#${href}`} className={className} onClick={e => { if (onClick) onClick(e); }}>{children}</a>;
}
function useRoute(pattern) {
  const { path } = useRouter();
  const parts = pattern.split('/');
  const segs  = path.split('/');
  if (parts.length !== segs.length) return [false, {}];
  const params = {};
  for (let i = 0; i < parts.length; i++) {
    if (parts[i].startsWith(':')) params[parts[i].slice(1)] = segs[i];
    else if (parts[i] !== segs[i]) return [false, {}];
  }
  return [true, params];
}

// ─── Icons (inline SVG) ───────────────────────────────────────────────────────

    {typeof d === 'string' ? <path d={d} /> : d}
  </svg>
);

  loader:       <>

  </>,

const I = ({ name, size=16, className='' }) => {
  const d = ICONS[name];
  if (!d) return null;
  return <Icon d={d} size={size} className={className} />;
};

// ─── UI helpers ───────────────────────────────────────────────────────────────
function cn(...classes) { return classes.filter(Boolean).join(' '); }

function Spinner({ size = 18 }) {
  return (
    <div className="spin" style={{ width: size, height: size, borderRadius: '50%', border: `2px solid rgba(255,255,255,.2)`, borderTopColor: '#3d7eff' }} />
  );
}

function Badge({ label, variant = 'default' }) {
  const styles = {
    default:    'bg-muted text-muted-foreground',
    uploaded:   'bg-slate-500/20 text-slate-400',
    analyzing:  'bg-warning/20 text-warning pulse',
    converting: 'bg-primary/20 text-primary pulse',
    ready:      'bg-success/20 text-success',
    approved:   'bg-purple-500/20 text-purple-400',
    saved:      'bg-secondary/20 text-secondary',
    open:       'bg-primary/20 text-primary',
    ordered:    'bg-success/20 text-success',
    confirmed:  'bg-primary/20 text-primary',
    in_production:'bg-warning/20 text-warning',
    qc:         'bg-purple-500/20 text-purple-400',
    shipped:    'bg-secondary/20 text-secondary',
    delivered:  'bg-success/20 text-success',
  };
  return (
    <span className={cn('inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold uppercase tracking-wide', styles[variant] || styles.default)}>
      <span className="w-1.5 h-1.5 rounded-full bg-current" />
      {label}
    </span>
  );
}

// ─── Layout ───────────────────────────────────────────────────────────────────
function Sidebar() {
  const { user, logout } = useAuth();
  const { path, navigate } = useRouter();

  const nav = [
    { href: '/dashboard',  label: 'Dashboard',     icon: 'dashboard' },
    { href: '/designs',    label: 'Design Files',  icon: 'file' },
    { href: '/quotes',     label: 'Quotes',        icon: 'calculator' },
    { href: '/providers',  label: 'Providers',     icon: 'users' },
    { href: '/orders',     label: 'Orders',        icon: 'package' },
  ];

  const isActive = href => path === href || path.startsWith(href + '/');

  return (
    <div className="w-60 min-w-[240px] bg-sidebar border-r border-border flex flex-col py-5 relative z-10" style={{ borderColor: '#1e2d40' }}>
      <div className="px-5 pb-5 mb-4 flex items-center gap-2.5 font-sans font-extrabold text-lg" style={{ borderBottom: '1px solid #1e2d40' }}>
        <div className="w-8 h-8 bg-primary rounded-lg flex items-center justify-center">
          <I name="hexagon" size={16} className="text-white" />
        </div>
        SheetForge
      </div>

      <div className="px-5 pb-2 text-[10px] font-semibold text-muted-foreground uppercase tracking-[1px]">Workspace</div>

      <div className="flex-1 overflow-y-auto flex flex-col gap-0.5">
        {nav.map(item => (
          <a key={item.href} href={`#${item.href}`}
            className={cn(
              'flex items-center gap-2.5 px-5 py-2.5 cursor-pointer transition-all text-[13.5px] font-medium border-l-2',
              isActive(item.href) ? 'text-primary bg-primary/10 border-primary' : 'text-muted-foreground border-transparent hover:text-foreground hover:bg-white/5'
            )}
          >
            <I name={item.icon} size={16} />
            {item.label}
          </a>
        ))}
      </div>

      {user && (
        <div className="mt-auto px-5 pt-4 flex items-center gap-2.5" style={{ borderTop: '1px solid #1e2d40' }}>
          <div className="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white uppercase" style={{ background: 'linear-gradient(135deg,#3d7eff,#a855f7)' }}>
            {user.firstName?.[0]}{user.lastName?.[0]}
          </div>
          <div className="flex-1 min-w-0">
            <div className="text-[13px] font-semibold truncate">{user.firstName} {user.lastName}</div>
            <div className="text-[11px] text-muted-foreground capitalize">{user.role}</div>
          </div>
          <button onClick={logout} className="text-muted-foreground hover:text-red-400 transition-colors">
            <I name="logout" size={16} />
          </button>
        </div>
      )}
    </div>
  );
}

function Topbar({ title, subtitle, actions }) {
  return (
    <div className="px-7 py-4 border-b border-border flex items-center gap-4 bg-sidebar sticky top-0 z-50" style={{ borderColor: '#1e2d40' }}>
      <div>
        <h1 className="font-sans text-base font-bold text-foreground">{title}</h1>
        {subtitle && <p className="text-xs text-muted-foreground mt-0.5">{subtitle}</p>}
      </div>
      <div className="ml-auto flex items-center gap-2.5">{actions}</div>
    </div>
  );
}

function AppLayout({ children }) {
  const { user, loading } = useAuth();
  const { navigate } = useRouter();

  useEffect(() => { if (!loading && !user) navigate('/'); }, [user, loading]);

  if (loading) return (
    <div className="h-screen w-full flex items-center justify-center bg-background">
      <Spinner size={32} />
    </div>
  );
  if (!user) return null;

  return (
    <div className="flex h-screen w-full bg-background overflow-hidden dark text-foreground">
      <Sidebar />
      <div className="flex-1 overflow-y-auto overflow-x-hidden flex flex-col relative">
        {children}
      </div>
    </div>
  );
}

// ─── Auth page ────────────────────────────────────────────────────────────────
function AuthPage() {
  const [isLogin, setIsLogin] = useState(true);
  const [role, setRole]       = useState('designer');
  const [email, setEmail]     = useState('');
  const [password, setPwd]    = useState('');
  const [firstName, setFirst] = useState('');
  const [lastName, setLast]   = useState('');
  const [company, setCompany] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError]     = useState('');
  const { login }             = useAuth();
  const { navigate }          = useRouter();

  const handleSubmit = async e => {
    e.preventDefault(); setError(''); setLoading(true);
    try {
      const endpoint = isLogin ? '/auth/login' : '/auth/register';
      const body     = isLogin ? { email, password } : { email, password, firstName, lastName, role, company };
      const data     = await apiFetch(endpoint, { method: 'POST', body: JSON.stringify(body) });
      login(data.token, data.user);
      navigate('/dashboard');
    } catch (err) {
      setError(isLogin ? 'Invalid email or password' : 'Registration failed — ' + err.message);
    } finally { setLoading(false); }
  };

  return (
    <div className="fixed inset-0 z-50 bg-background flex items-center justify-center flex-col dark text-foreground">
      <div className="absolute inset-0 overflow-hidden pointer-events-none">
        <div style={{ position:'absolute', top:'-200px', left:'50%', transform:'translateX(-50%)', width:'800px', height:'800px', background:'radial-gradient(ellipse,rgba(61,126,255,.08) 0%,transparent 70%)', borderRadius:'50%' }} />
        <div style={{ position:'absolute', bottom:'-200px', right:'-100px', width:'600px', height:'600px', background:'radial-gradient(ellipse,rgba(0,212,160,.06) 0%,transparent 70%)', borderRadius:'50%' }} />
      </div>

      <div className="flex items-center gap-3 mb-12 font-sans text-[28px] font-extrabold tracking-tight">
        <div className="w-11 h-11 bg-primary rounded-xl flex items-center justify-center text-white">
          <I name="hexagon" size={24} />
        </div>
        SheetForge
      </div>

      <div className="bg-card border border-border rounded-2xl p-10 w-[420px] relative z-10 shadow-2xl">
        <div className="flex p-1 bg-background rounded-lg mb-7">
          {['Sign In', 'Create Account'].map((label, idx) => (
            <button key={label}
              className={cn('flex-1 py-2 text-[13px] font-medium rounded-md transition-all', (!idx ? isLogin : !isLogin) ? 'bg-primary text-white' : 'text-muted-foreground')}
              onClick={() => { setIsLogin(!idx); setError(''); }}
            >{label}</button>
          ))}
        </div>

        <form onSubmit={handleSubmit} className="flex flex-col gap-4">
          {!isLogin && (
            <>
              <div className="grid grid-cols-2 gap-2.5 mb-2">
                {['designer','provider'].map(r => (
                  <button key={r} type="button" onClick={() => setRole(r)}
                    className={cn('border rounded-lg p-3.5 text-center transition-all', role===r ? 'border-primary bg-primary/10':'border-border hover:border-primary')}
                  >
                    <I name={r==='designer'?'user':'building'} size={20} className={cn('mx-auto mb-1.5', role===r?'text-primary':'text-muted-foreground')} />
                    <span className="text-[12px] font-medium text-muted-foreground capitalize">{r}</span>
                  </button>
                ))}
              </div>
              <div className="grid grid-cols-2 gap-4">
                <Field label="First Name" value={firstName} onChange={e=>setFirst(e.target.value)} required />
                <Field label="Last Name"  value={lastName}  onChange={e=>setLast(e.target.value)}  required />
              </div>
              <Field label="Company (Optional)" value={company} onChange={e=>setCompany(e.target.value)} />
            </>
          )}
          <Field label="Email Address" type="email"    value={email}    onChange={e=>setEmail(e.target.value)}   required />
          <Field label="Password"      type="password" value={password} onChange={e=>setPwd(e.target.value)}    required />

          <button type="submit" disabled={loading}
            className="w-full p-3 bg-primary text-white rounded-lg font-semibold text-sm mt-2 hover:bg-blue-500 disabled:opacity-50 flex items-center justify-center gap-2 transition-all"
          >
            {loading && <Spinner size={16} />}
            {isLogin ? 'Sign In to Workspace' : 'Create Account'}
          </button>
        </form>

        {error && <div className="mt-4 p-3 bg-red-500/10 text-red-400 text-sm rounded-lg border border-red-500/20 text-center">{error}</div>}
      </div>
    </div>
  );
}

function Field({ label, type='text', value, onChange, required, placeholder }) {
  return (
    <div>
      <label className="block text-[12px] font-medium text-muted-foreground mb-1.5 uppercase tracking-[0.5px]">{label}</label>
      <input type={type} required={required} value={value} onChange={onChange} placeholder={placeholder}
        className="w-full p-2.5 bg-background border border-border rounded-lg text-sm text-foreground focus:border-primary focus:outline-none transition-colors" />
    </div>
  );
}

// ─── Dashboard ────────────────────────────────────────────────────────────────
function Dashboard() {
  const [summary,  setSummary]  = useState(null);
  const [activity, setActivity] = useState([]);
  const [loading,  setLoading]  = useState(true);

  useEffect(() => {
    Promise.all([
      apiFetch('/dashboard/summary'),
      apiFetch('/dashboard/activity'),
    ]).then(([s, a]) => { setSummary(s); setActivity(a); }).finally(() => setLoading(false));
  }, []);

  const typeIcon = { upload:'file', convert:'activity', approve:'checkCircle', order:'package', quote:'calculator' };
  const typeColor = { upload:'text-primary bg-primary/10', convert:'text-blue-400 bg-blue-500/10', approve:'text-success bg-success/10', order:'text-orange-400 bg-orange-500/10', quote:'text-purple-400 bg-purple-500/10' };

  return (
    <AppLayout>
      <Topbar title="Dashboard" subtitle="Overview of your workspace"
        actions={<a href="#/designs/upload" className="flex items-center gap-1.5 bg-primary text-white px-4 py-2 rounded-lg text-[13px] font-medium hover:bg-blue-500 transition-colors"><I name="plus" size={14}/> New Design</a>}
      />
      <div className="p-7 space-y-6">
        {loading ? (
          <div className="grid grid-cols-4 gap-4">{[1,2,3,4].map(i=><div key={i} className="bg-card border border-border rounded-xl p-5 h-[120px] pulse" />)}</div>
        ) : summary && (
          <div className="grid grid-cols-4 gap-4 fade-in">
            <StatCard label="Total Designs"  value={summary.totalDesigns}          icon="file"       trend="+12% this month" />
            <StatCard label="Pending CV"     value={summary.pendingConversions}     icon="clock" />
            <StatCard label="Active Quotes"  value={summary.totalQuotes}            icon="calculator" />

// ─── Design Upload ────────────────────────────────────────────────────────────
function DesignUpload() {
  const [file,      setFile]      = useState(null);
  const [partName,  setPartName]  = useState('');
  const [material,  setMaterial]  = useState('');
  const [thickness, setThickness] = useState('');
  const [uploading, setUploading] = useState(false);
  const [error,     setError]     = useState('');
  const fileRef = useRef();
  const { navigate } = useRouter();

  const handleDrop = e => {
    e.preventDefault();
    const f = e.dataTransfer.files?.[0];
    if (f) { setFile(f); if (!partName) setPartName(f.name.replace(/\.[^.]+$/,'')); }
  };

  const handleSubmit = async e => {
    e.preventDefault();
    if (!file) { setError('Please select a file'); return; }
    setUploading(true); setError('');
    try {
      const fd = new FormData();
      fd.append('file', file);
      if (partName)  fd.append('partName',  partName);
      if (material)  fd.append('material',  material);
      if (thickness) fd.append('thickness', thickness);
      const token = localStorage.getItem('sheetforge_token');
      const res = await fetch(`${BASE}/designs`, { method:'POST', headers:{ Authorization:`Bearer ${token}` }, body: fd });
      if (!res.ok) throw new Error((await res.json()).error || 'Upload failed');
      const data = await res.json();
      navigate(`/designs/${data.id}`);
    } catch (err) { setError(err.message); setUploading(false); }
  };

  return (
    <AppLayout>
      <Topbar title="Upload Design" />
      <div className="p-7 max-w-2xl mx-auto w-full">
        <form onSubmit={handleSubmit} className="space-y-6">
          <div className="border-2 border-dashed border-border hover:border-primary bg-card rounded-2xl p-10 text-center cursor-pointer transition-all"
            onClick={() => fileRef.current?.click()} onDragOver={e=>e.preventDefault()} onDrop={handleDrop}>
            <input type="file" ref={fileRef} className="hidden" accept=".pdf,.dxf,.png,.jpg,.jpeg"
              onChange={e => { const f=e.target.files?.[0]; if(f){setFile(f);if(!partName)setPartName(f.name.replace(/\.[^.]+$/,''))} }} />
            {file ? (
              <div className="flex flex-col items-center">
                <div className="w-16 h-16 bg-primary/10 rounded-2xl flex items-center justify-center text-primary mb-4"><I name="file" size={32} /></div>
                <h3 className="font-semibold text-lg">{file.name}</h3>
                <p className="text-sm text-muted-foreground font-mono mt-1">{(file.size/1024/1024).toFixed(2)} MB</p>
                <button type="button" onClick={e=>{e.stopPropagation();setFile(null)}} className="mt-4 text-sm text-red-400 hover:underline">Remove file</button>
              </div>
            ) : (
              <div className="flex flex-col items-center">
                <div className="w-16 h-16 bg-background border border-border rounded-2xl flex items-center justify-center text-primary mb-4"><I name="upload" size={32} /></div>
                <h3 className="font-semibold text-lg mb-1">Click to browse or drag file here</h3>
                <p className="text-sm text-muted-foreground">Supported formats: PDF, DXF, PNG, JPG</p>
              </div>
            )}
          </div>

          <div className="bg-card border border-border rounded-xl p-6 space-y-4">
            <h3 className="font-bold text-sm border-b border-border pb-3">Design Details</h3>
            <Field label="Part Name" value={partName} onChange={e=>setPartName(e.target.value)} placeholder="e.g. Bracket Assembly v2" required />
            <div className="grid grid-cols-2 gap-4">
              <div>
                <label className="block text-[12px] font-medium text-muted-foreground mb-1.5 uppercase tracking-[0.5px]">Material</label>
                <select value={material} onChange={e=>setMaterial(e.target.value)} className="w-full p-2.5 bg-background border border-border rounded-lg text-sm text-foreground focus:border-primary focus:outline-none">
                  <option value="">Select Material...</option>
                  {['Aluminum 6061','Stainless Steel 304','Mild Steel','Brass','Titanium','Copper'].map(m=><option key={m}>{m}</option>)}
                </select>
              </div>
              <Field label="Thickness (mm)" type="number" value={thickness} onChange={e=>setThickness(e.target.value)} placeholder="e.g. 2.5" />
            </div>
          </div>

          {error && <div className="p-4 bg-red-500/10 text-red-400 border border-red-500/20 rounded-lg flex items-center gap-2 text-sm"><I name="alertCircle" size={16}/> {error}</div>}

          <div className="flex justify-end gap-3">
            <button type="button" onClick={()=>navigate('/designs')} className="px-5 py-2.5 rounded-lg text-sm font-medium text-foreground hover:bg-white/5 border border-transparent transition-colors">Cancel</button>
            <button type="submit" disabled={!file||uploading} className="px-6 py-2.5 rounded-lg text-sm font-semibold bg-primary text-white hover:bg-blue-500 disabled:opacity-50 flex items-center gap-2 transition-colors">
              {uploading && <Spinner size={14} />}
              {uploading ? 'Uploading...' : 'Upload & Analyze'}
            </button>
          </div>
        </form>
      </div>
    </AppLayout>
  );
}

  useEffect(() => {
    apiFetch(`/designs/${id}`).then(setDesign).finally(()=>setLoading(false));

    setConverting(true);
    // Navigate to pipeline view immediately so the user sees progress
    navigate(`/convert/${id}`);
    // Kick off conversion in background — ConvertPipeline polls /convert/:id/status
    apiFetch(`/convert/${id}`, { method:'POST', body:JSON.stringify({}) }).catch(console.error);

  if (loading) return <AppLayout><div className="p-7">Loading...</div></AppLayout>;
  if (!design) return <AppLayout><div className="p-7">Design not found</div></AppLayout>;

  const a = design.aiAnalysis || {};

        {design.status === 'approved' && (
          <button onClick={async()=>{setConverting(true);try{await apiFetch(`/cloud/save/${id}`,{method:'POST'});navigate(`/preview/${id}`);}catch{}setConverting(false);}}
            disabled={converting} className="bg-primary text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 hover:bg-blue-500 disabled:opacity-50 transition-colors">
            {converting?<Spinner size={14}/>:<I name="upload" size={14}/>} Save to Cloud

          <span className="text-xs font-medium text-secondary flex items-center gap-1.5"><I name="checkCircle" size={13}/> Cloud Saved</span>
        )}
      </>}
    </>
  );

  return (
    <AppLayout>
      <Topbar title={design.partName} subtitle={`ID: ${id.substring(0,8)} • ${design.status}`} actions={actions} />
      <div className="p-7 grid grid-cols-3 gap-6">
        <div className="col-span-2 bg-card border border-border rounded-xl overflow-hidden">
          <div className="px-5 py-4 border-b border-border"><h2 className="font-bold text-sm">Original File</h2></div>
          <div className="p-5 flex justify-center items-center bg-black/20 min-h-[400px]">
            {(() => {
              const f = design.originalFile;
              if (!f?.url) return (
                <div className="text-center text-muted-foreground font-mono text-sm">
                  <I name="file" size={36} className="mx-auto mb-3 opacity-20"/>

              if (isImg) return (

                  crossOrigin="anonymous"

        <div className="space-y-6">

                  ['Tolerance',    a.tolerance||'—'],

// ─── Convert Pipeline ─────────────────────────────────────────────────────────
function ConvertPipeline() {
  const [,params] = useRoute('/convert/:id');
  const id = params?.id || '';
  const [status, setStatus] = useState(null);
  const [convStarted, setConvStarted] = useState(false);
  const { navigate } = useRouter();

  useEffect(() => {
    if (!id) return;
    let interval;
    let done = false;

    // Ensure conversion is running (safe to call even if already started)
    if (!convStarted) {
      setConvStarted(true);
      apiFetch(`/convert/${id}/status`).then(s => {
        // If not yet converting, kick it off
        if (s.status === 'uploaded') {
          apiFetch(`/convert/${id}`, { method:'POST', body:JSON.stringify({}) }).catch(console.error);
        }
      }).catch(console.error);
    }

    const poll = () => {
      apiFetch(`/convert/${id}/status`).then(s => {
        setStatus(s);
        if ((s.status === 'ready' || s.status === 'approved' || s.status === 'saved') && !done) {
          done = true;
          clearInterval(interval);
          setTimeout(() => navigate(`/verify/${id}`), 1800);
        }
      }).catch(() => {});
    };

    poll();
    interval = setInterval(poll, 2500);
    return () => { clearInterval(interval); };
  }, [id]);

  const totalSteps = status?.steps?.length || 23;
  const doneSteps  = status?.steps?.filter(s => s.status === 'done').length || 0;
  const pct        = status?.progress ?? Math.round((doneSteps / totalSteps) * 100);

  const stageColors = {
    done:    { bg: 'bg-success/10', border: 'border-success/20', icon: 'text-success',   label: 'text-foreground' },
    running: { bg: 'bg-primary/8',  border: 'border-primary/40', icon: 'text-primary',   label: 'text-primary' },
    pending: { bg: 'bg-background', border: 'border-border',     icon: 'text-muted-foreground', label: 'text-muted-foreground' },
  };

  return (
    <AppLayout>
      <Topbar title="AI Conversion Pipeline" subtitle={`Processing design ${id.substring(0,8)} • 23-stage OpenCV + Claude Vision`} />
      <div className="max-w-3xl mx-auto w-full p-6">
        <div className="bg-card border border-border rounded-xl p-6 shadow-xl mb-4">
          <div className="flex justify-between items-end mb-3">
            <div>
              <h2 className="font-bold text-base">Conversion Progress</h2>
              <p className="text-xs text-muted-foreground mt-0.5">OpenCV → Claude Vision → ezdxf R2018 DXF</p>
            </div>
            <span className="font-mono text-primary font-bold text-xl">{pct}%</span>
          </div>
          <div className="h-2.5 bg-background border border-border rounded-full overflow-hidden mb-1">
            <div className="h-full bg-gradient-to-r from-primary to-secondary transition-all duration-700 rounded-full"
                 style={{ width:`${pct}%` }} />
          </div>
          <div className="flex justify-between text-[10px] text-muted-foreground font-mono mt-1">
            <span>Stage {doneSteps} of {totalSteps}</span>
            <span>{status?.currentStep || 'Initialising...'}</span>
          </div>
        </div>

        <div className="space-y-1.5 max-h-[60vh] overflow-y-auto pr-1">
          {(status?.steps || Array.from({length:23},(_,i)=>({name:`Stage ${i+1}`,status:'pending'}))).map((step, i) => {
            const c = stageColors[step.status] || stageColors.pending;
            return (
              <div key={i} className={cn('flex items-center justify-between px-4 py-2.5 rounded-lg border transition-all', c.bg, c.border)}>
                <div className="flex items-center gap-3 min-w-0">
                  {step.status === 'done'    && <I name="checkCircle" size={15} className={c.icon + ' flex-shrink-0'} />}
                  {step.status === 'running' && <div className="spin flex-shrink-0"><I name="loader" size={15} className={c.icon} /></div>}
                  {step.status === 'pending' && <div className="w-3.5 h-3.5 rounded-full border-2 border-border flex-shrink-0" />}
                  <div className="min-w-0">
                    <div className={cn('font-medium text-xs truncate', c.label)}>{step.name}</div>
                    {step.details && <div className="text-[10px] text-muted-foreground font-mono truncate">{step.details}</div>}
                  </div>
                </div>
                {step.duration && <div className="text-[10px] font-mono text-muted-foreground flex-shrink-0 ml-2">{step.duration}ms</div>}
              </div>
            );
          })}
        </div>

        {status?.status === 'ready' && (
          <div className="mt-4 p-4 bg-success/10 border border-success/30 rounded-xl text-success text-center font-semibold fade-in flex items-center justify-center gap-2">
            <I name="checkCircle" size={18}/> All 23 stages complete — DXF generated. Redirecting to verification…
          </div>
        )}
      </div>
    </AppLayout>
  );
}

// ─── Verify Analysis ──────────────────────────────────────────────────────────
function VerifyAnalysis() {
  const [,params] = useRoute('/verify/:id');
  const id = params?.id || '';
  const [design,    setDesign]   = useState(null);
  const [loading,   setLoading]  = useState(true);
  const [formData,  setFormData] = useState({});
  const [saving,    setSaving]   = useState(false);
  const [uploading, setUploading]= useState(false);
  const [cloudMsg,  setCloudMsg] = useState('');
  const { navigate } = useRouter();

  useEffect(() => {
    apiFetch(`/designs/${id}`).then(d => { setDesign(d); setFormData(d.aiAnalysis||{}); }).finally(()=>setLoading(false));
  }, [id]);

  const approve = async () => {
    setSaving(true);
    try {
      await apiFetch(`/designs/${id}/approve`, { method:'PATCH', body: JSON.stringify({ correctedAnalysis: formData }) });
      navigate(`/designs/${id}`);
    } catch {} finally { setSaving(false); }
  };

  const approveAndUpload = async () => {
    setUploading(true); setCloudMsg('');
    try {
      await apiFetch(`/designs/${id}/approve`, { method:'PATCH', body: JSON.stringify({ correctedAnalysis: formData }) });
      setCloudMsg('Approved. Uploading DXF + assets to Cloudinary…');
      const result = await apiFetch(`/cloud/save/${id}`, { method:'POST' });
      const uploaded = result.uploads || [];
      setCloudMsg(`✓ Saved to Cloudinary — ${uploaded.length} file(s) uploaded`);
      setTimeout(() => navigate(`/designs/${id}`), 1800);
    } catch(err) {
      setCloudMsg(`Error: ${err.message}`);
      setUploading(false);
    }
  };

  const N = ({ label, field, type='number', step='0.01' }) => (
    <div className="grid grid-cols-2 items-center gap-3">
      <label className="text-xs text-muted-foreground">{label}</label>
      <input type={type} step={step} value={formData[field]??''} onChange={e=>setFormData({...formData,[field]:type==='number'?Number(e.target.value):e.target.value})}
        className="w-full bg-background border border-border rounded-md px-2.5 py-1.5 text-xs font-mono text-foreground focus:border-primary focus:outline-none" />
    </div>
  );

  if (loading) return <AppLayout><div className="p-7 text-muted-foreground">Loading design…</div></AppLayout>;

  const conf = formData.confidence || 0;
  const confColor = conf >= 90 ? 'text-success' : conf >= 75 ? 'text-warning' : 'text-red-400';

  return (
    <AppLayout>
      <Topbar title="Human Verification" subtitle="Review AI-extracted geometry • Correct any values • Approve to generate DXF"
        actions={
          <div className="flex gap-2">
            <button onClick={()=>navigate(`/designs/${id}`)} className="px-3 py-2 border border-border rounded-lg text-xs hover:bg-white/5 transition-colors">Cancel</button>
            <button onClick={approve} disabled={saving||uploading} className="px-3 py-2 bg-card border border-border text-foreground rounded-lg text-xs font-medium flex items-center gap-1.5 hover:bg-white/5 disabled:opacity-50 transition-colors">
              {saving ? <Spinner size={13}/> : <I name="check" size={13}/>} Approve Only
            </button>
            <button onClick={approveAndUpload} disabled={saving||uploading} className="px-4 py-2 bg-primary text-white rounded-lg text-xs font-semibold flex items-center gap-1.5 hover:bg-blue-500 disabled:opacity-50 transition-colors">
              {uploading ? <Spinner size={13}/> : <I name="upload" size={13}/>} Approve + Save to Cloud
            </button>
          </div>
        }
      />

      {cloudMsg && (
        <div className={cn('mx-6 mt-4 p-3 rounded-lg text-xs font-medium flex items-center gap-2 fade-in border',
          cloudMsg.startsWith('✓') ? 'bg-success/10 border-success/30 text-success' :
          cloudMsg.startsWith('Error') ? 'bg-red-500/10 border-red-500/20 text-red-400' :
          'bg-primary/10 border-primary/20 text-primary')}>
          {uploading && <Spinner size={12}/>}
          {cloudMsg}
        </div>
      )}

      <div className="p-6 grid grid-cols-3 gap-5 max-w-6xl mx-auto w-full">
        {/* Left column: Geometry */}
        <div className="space-y-4">
          <div className="bg-card border border-border rounded-xl p-5">
            <h2 className="font-bold text-xs uppercase tracking-wider text-muted-foreground mb-4">Geometry (mm)</h2>
            <div className="space-y-3">
              <N label="Width"     field="width" />
              <N label="Height"    field="height" />
              <N label="Thickness" field="thickness" />
            </div>
          </div>
          <div className="bg-card border border-border rounded-xl p-5">
            <h2 className="font-bold text-xs uppercase tracking-wider text-muted-foreground mb-4">Features</h2>
            <div className="space-y-3">
              <N label="Holes"        field="holes"         step="1" />
              <N label="Hole Ø (mm)"  field="holesDiameter" />
              <N label="Bend Lines"   field="bendLines"     step="1" />
              <N label="Slots"        field="slots"         step="1" />
              <N label="Cutouts"      field="cutouts"       step="1" />
              <N label="Total Edges"  field="edges"         step="1" />
            </div>
          </div>
        </div>

        {/* Middle column: Classification + CV stats */}
        <div className="space-y-4">
          <div className="bg-card border border-border rounded-xl p-5">
            <h2 className="font-bold text-xs uppercase tracking-wider text-muted-foreground mb-4">Classification</h2>
            <div className="space-y-3">
              <div className="grid grid-cols-2 items-center gap-3">
                <label className="text-xs text-muted-foreground">Profile Type</label>
                <select value={formData.profileType||''} onChange={e=>setFormData({...formData,profileType:e.target.value})}
                  className="w-full bg-background border border-border rounded-md px-2.5 py-1.5 text-xs text-foreground focus:border-primary focus:outline-none">
                  {['sheet metal','plate','bracket','enclosure','gasket','stamping','other'].map(v=><option key={v}>{v}</option>)}
                </select>
              </div>
              <div className="grid grid-cols-2 items-center gap-3">
                <label className="text-xs text-muted-foreground">Tolerance</label>
                <select value={formData.tolerance||''} onChange={e=>setFormData({...formData,tolerance:e.target.value})}
                  className="w-full bg-background border border-border rounded-md px-2.5 py-1.5 text-xs text-foreground focus:border-primary focus:outline-none">
                  {['±0.05mm','±0.1mm','±0.5mm','±1mm'].map(v=><option key={v}>{v}</option>)}
                </select>
              </div>
              <div className="grid grid-cols-2 items-center gap-3">
                <label className="text-xs text-muted-foreground">Material</label>
                <select value={formData.material||''} onChange={e=>setFormData({...formData,material:e.target.value})}
                  className="w-full bg-background border border-border rounded-md px-2.5 py-1.5 text-xs text-foreground focus:border-primary focus:outline-none">
                  {['unknown','aluminum','stainless','mild steel','brass','copper','titanium'].map(v=><option key={v}>{v}</option>)}
                </select>
              </div>
            </div>
          </div>

          <div className="bg-card border border-border rounded-xl p-5">
            <h2 className="font-bold text-xs uppercase tracking-wider text-muted-foreground mb-4">CV Detection Stats</h2>
            <div className="space-y-2.5">
              {[
                ['Lines Detected',  formData.linesDetected],
                ['Corners',         formData.corners],
                ['Keypoints',       formData.keypoints],
                ['Regions',         formData.regions],
              ].map(([k,v]) => v != null && (
                <div key={k} className="flex justify-between text-xs border-b border-border pb-2 last:border-0">
                  <span className="text-muted-foreground">{k}</span>
                  <span className="font-mono">{v}</span>
                </div>
              ))}
            </div>
          </div>

          <div className="bg-card border border-border rounded-xl p-5">
            <h2 className="font-bold text-xs uppercase tracking-wider text-muted-foreground mb-3">AI Confidence</h2>
            <div className={cn('text-4xl font-black font-mono text-center py-2', confColor)}>{conf}%</div>
            <div className="h-2 bg-background border border-border rounded-full mt-2 overflow-hidden">
              <div className={cn('h-full rounded-full transition-all', conf>=90?'bg-success':conf>=75?'bg-warning':'bg-red-400')}
                   style={{width:`${conf}%`}} />
            </div>
            {formData.notes && <p className="text-[10px] text-muted-foreground mt-3 italic leading-relaxed">{formData.notes}</p>}
          </div>
        </div>

        {/* Right column: Preview */}
        <div className="bg-card border border-border rounded-xl overflow-hidden flex flex-col">
          <div className="px-4 py-3 border-b border-border flex justify-between items-center">
            <h2 className="font-bold text-xs uppercase tracking-wider text-muted-foreground">Preview</h2>
            {design?.dwg?.dxfUrl && (
              <a href={design.dwg.dxfUrl} download className="text-[10px] text-primary hover:underline flex items-center gap-1">
                <I name="file" size={11}/> DXF
              </a>
            )}
          </div>
          <div className="flex-1 bg-black/30 p-2 flex items-center justify-center min-h-[280px]">
            {design?.dwg?.svgUrl ? (
              <img src={design.dwg.svgUrl} alt="DXF Preview" className="max-w-full max-h-full object-contain" />
            ) : design?.originalFile?.url && design?.originalFile?.mimetype?.includes('image') ? (
              <img src={design.originalFile.url} alt="Original" className="max-w-full max-h-full object-contain opacity-70" />
            ) : (
              <div className="text-muted-foreground text-xs font-mono text-center">
                <I name="file" size={28} className="mx-auto mb-2 opacity-20"/>
                No visual preview
              </div>
            )}
          </div>
          {design?.dwg && (
            <div className="px-4 py-2.5 border-t border-border bg-background/50 flex gap-4 text-[10px] font-mono text-muted-foreground">
              <span><span className="text-secondary">Entities</span> {design.dwg.entities||0}</span>
              <span><span className="text-secondary">Size</span> {((design.dwg.fileSize||0)/1024).toFixed(1)}KB</span>
            </div>
          )}
        </div>
      </div>
    </AppLayout>
  );
}

// ─── CAD Preview ──────────────────────────────────────────────────────────────
function CADPreview() {
  const [,params] = useRoute('/preview/:id');
  const id = params?.id || '';
  const [design,   setDesign]   = useState(null);
  const [saving,   setSaving]   = useState(false);
  const [cloudMsg, setCloudMsg] = useState('');
  const { navigate } = useRouter();

  useEffect(() => { apiFetch(`/designs/${id}`).then(setDesign); }, [id]);

  const saveToCloud = async () => {
    if (!design || design.status !== 'approved') return;
    setSaving(true); setCloudMsg('Uploading DXF, SVG + original to Cloudinary…');
    try {
      const result = await apiFetch(`/cloud/save/${id}`, { method:'POST' });
      const n = (result.uploads||[]).length;
      setCloudMsg(`✓ ${n} file(s) saved to Cloudinary + MongoDB`);
      setDesign(result);
    } catch(err) {
      setCloudMsg(`Error: ${err.message}`);
    } finally { setSaving(false); }
  };

  const a   = design?.aiAnalysis || {};
  const dwg = design?.dwg || {};
  const W   = a.width  || 200;
  const H   = a.height || 150;

  return (
    <AppLayout>
      <Topbar title="CAD Viewer" subtitle={design?.partName || 'Loading…'}
        actions={
          <div className="flex items-center gap-2">
            {dwg.dxfUrl && (
              <a href={dwg.dxfUrl} download className="border border-border bg-card hover:bg-white/5 px-3 py-2 rounded-lg text-xs font-medium flex items-center gap-1.5 transition-colors">
                <I name="file" size={13}/> Download DXF
              </a>
            )}
            {design?.status === 'approved' && (
              <button onClick={saveToCloud} disabled={saving || design?.status === 'saved'} className="bg-secondary text-white px-4 py-2 rounded-lg text-xs font-semibold flex items-center gap-1.5 hover:bg-teal-500 disabled:opacity-50 transition-colors">
                {saving ? <Spinner size={13}/> : <I name="upload" size={13}/>}
                {design?.status === 'saved' ? 'Saved to Cloud' : 'Save to Cloud'}
              </button>
            )}
            {design?.cloudinary?.url && (
              <a href={design.cloudinary.url} target="_blank" className="text-xs text-primary hover:underline flex items-center gap-1">
                <I name="eye" size={12}/> View on Cloudinary
              </a>
            )}
          </div>
        }
      />

      {cloudMsg && (
        <div className={cn('mx-5 mt-3 px-4 py-2.5 rounded-lg text-xs font-medium flex items-center gap-2 fade-in border',
          cloudMsg.startsWith('✓') ? 'bg-success/10 border-success/30 text-success' :
          cloudMsg.startsWith('Error') ? 'bg-red-500/10 border-red-500/20 text-red-400' :
          'bg-primary/10 border-primary/20 text-primary')}>
          {saving && <Spinner size={11}/>}
          {cloudMsg}
        </div>
      )}

      <div className="flex-1 p-4 flex flex-col gap-3">
        {/* Viewer */}
        <div className="bg-white rounded-xl flex-1 relative overflow-hidden shadow-inner border border-border" style={{minHeight:460}}>
          <div className="w-full h-full flex items-center justify-center"
               style={{background:'#f8fafc', backgroundImage:'radial-gradient(#cbd5e1 1px,transparent 1px)', backgroundSize:'20px 20px', minHeight:460}}>
            {dwg.svgUrl ? (
              <img src={dwg.svgUrl} alt="DXF Preview" className="max-w-full max-h-[440px] object-contain" />
            ) : (
              /* Fallback: render geometry from aiAnalysis */
              <svg viewBox="0 0 800 600" style={{width:'100%',height:'100%',maxWidth:800,maxHeight:560}}>
                {(() => {
                  const scale = Math.min(600/Math.max(W,1), 440/Math.max(H,1));
                  const sw = W*scale, sh = H*scale;
                  const ox = (800-sw)/2, oy = (560-sh)/2;
                  const holes = a.holes || 0;
                  const holeR = ((a.holesDiameter||6)/2)*scale;
                  const bends = a.bendLines || 0;
                  return (<g>
                    <rect x={ox} y={oy} width={sw} height={sh} fill="none" stroke="#3d7eff" strokeWidth="2"/>
                    {Array.from({length:holes},(_,i)=>{
                      const cx = ox + sw*(i+1)/(holes+1); const cy = oy+sh/2;
                      return <g key={i}>
                        <circle cx={cx} cy={cy} r={holeR} fill="none" stroke="#00d4a0" strokeWidth="1.5"/>
                        <line x1={cx-holeR*1.6} y1={cy} x2={cx+holeR*1.6} y2={cy} stroke="#a855f7" strokeWidth="1" strokeDasharray="4,3"/>
                        <line x1={cx} y1={cy-holeR*1.6} x2={cx} y2={cy+holeR*1.6} stroke="#a855f7" strokeWidth="1" strokeDasharray="4,3"/>
                      </g>;
                    })}
                    {Array.from({length:bends},(_,i)=>{
                      const yp = oy + sh*(i+1)/(bends+1);
                      return <line key={i} x1={ox} y1={yp} x2={ox+sw} y2={yp} stroke="#f59e0b" strokeWidth="1.5" strokeDasharray="8,4"/>;
                    })}
                    <line x1={ox} y1={oy+sh+14} x2={ox+sw} y2={oy+sh+14} stroke="#94a3b8" strokeWidth="1"/>
                    <text x={ox+sw/2} y={oy+sh+26} fill="#64748b" fontSize="11" textAnchor="middle" fontFamily="monospace">{W} mm</text>
                    <line x1={ox+sw+14} y1={oy} x2={ox+sw+14} y2={oy+sh} stroke="#94a3b8" strokeWidth="1"/>
                    <text x={ox+sw+28} y={oy+sh/2} fill="#64748b" fontSize="11" textAnchor="middle" fontFamily="monospace"
                          transform={`rotate(90,${ox+sw+28},${oy+sh/2})`}>{H} mm</text>
                  </g>);
                })()}
              </svg>
            )}
          </div>

          {/* Legend */}
          <div className="absolute bottom-3 left-3 right-3 bg-[#1a2132]/90 backdrop-blur border border-white/15 rounded-lg p-3 flex flex-wrap gap-x-5 gap-y-1 text-white text-[11px] font-mono">
            <span><span style={{color:'#00d4a0'}}>Holes</span> {a.holes||0} × Ø{a.holesDiameter||0}mm</span>
            <span><span style={{color:'#f59e0b'}}>Bends</span> {a.bendLines||0}</span>
            <span><span style={{color:'#3d7eff'}}>W×H</span> {W}×{H}mm</span>
            <span><span style={{color:'#00d4a0'}}>Entities</span> {dwg.entities||0}</span>
            <span><span style={{color:'#a855f7'}}>Tolerance</span> {a.tolerance||'±0.1mm'}</span>
            <span className="ml-auto text-white/40">{a.profileType||'sheet metal'} • {a.material||'unknown'}</span>
          </div>
        </div>

        {/* Analysis cards */}
        <div className="grid grid-cols-5 gap-3">
          {[
            ['Width',     `${W} mm`,                '#3d7eff'],
            ['Height',    `${H} mm`,                '#3d7eff'],
            ['Thickness', `${a.thickness||'?'} mm`, '#00d4a0'],
            ['Entities',  dwg.entities||0,           '#a855f7'],
            ['Confidence',`${a.confidence||0}%`,     '#f59e0b'],
          ].map(([k,v,c]) => (
            <div key={k} className="bg-card border border-border rounded-lg p-3 text-center">
              <div className="text-[10px] uppercase tracking-wider text-muted-foreground mb-1">{k}</div>
              <div className="font-mono font-bold text-sm" style={{color:c}}>{v}</div>
            </div>
          ))}
        </div>
      </div>
    </AppLayout>
  );
}

// ─── Quote New ────────────────────────────────────────────────────────────────
function QuoteNew() {
  const [designs,  setDesigns]  = useState([]);
  const [designId, setDesignId] = useState('');
  const [material, setMaterial] = useState('');
  const [quantity, setQuantity] = useState(1);
  const [finish,   setFinish]   = useState('');
  const [saving,   setSaving]   = useState(false);
  const [error,    setError]    = useState('');

  useEffect(() => { apiFetch('/designs?status=approved').then(d=>setDesigns(d.designs||[])); }, []);

  const handleSubmit = async e => {
    e.preventDefault(); if (!designId) return;
    setSaving(true); setError('');
    try {
      const data = await apiFetch('/quotes', { method:'POST', body: JSON.stringify({ designId, specs:{ material, quantity, finish, operations:['Laser Cutting','Bending'] } }) });
      navigate(`/quotes/${data.id}`);
    } catch (err) { setError(err.message); setSaving(false); }
  };

  return (
    <AppLayout>
      <Topbar title="Request a Quote" />
      <div className="p-7 max-w-2xl mx-auto w-full">
        <form onSubmit={handleSubmit} className="bg-card border border-border rounded-xl p-6 space-y-6">
          <div>
            <label className="block text-[12px] font-medium text-muted-foreground mb-1.5 uppercase tracking-[0.5px]">Select Design</label>
            <select required value={designId} onChange={e=>setDesignId(e.target.value)} className="w-full p-2.5 bg-background border border-border rounded-lg text-sm text-foreground focus:border-primary focus:outline-none">
              <option value="">-- Choose an approved design --</option>
              {designs.map(d=><option key={d.id} value={d.id}>{d.partName} ({d.id.substring(0,8)})</option>)}
            </select>
            {designs.length===0 && <p className="text-xs text-red-400 mt-2">No approved designs. Upload and approve a design first.</p>}
          </div>
          <div className="grid grid-cols-2 gap-4">
            <Field label="Quantity" type="number" value={quantity} onChange={e=>setQuantity(Number(e.target.value))} required />
            <Field label="Material Override" value={material} onChange={e=>setMaterial(e.target.value)} placeholder="e.g. Al 6061-T6" />
          </div>
          <div>
            <label className="block text-[12px] font-medium text-muted-foreground mb-1.5 uppercase tracking-[0.5px]">Finish</label>
            <select value={finish} onChange={e=>setFinish(e.target.value)} className="w-full p-2.5 bg-background border border-border rounded-lg text-sm text-foreground focus:border-primary focus:outline-none">
              {['As Machined','Bead Blast','Anodize - Clear','Anodize - Black','Powder Coat'].map(f=><option key={f} value={f}>{f}</option>)}
            </select>
          </div>
          {error && <div className="p-3 bg-red-500/10 text-red-400 text-sm rounded-lg border border-red-500/20">{error}</div>}
          <div className="pt-4 border-t border-border flex justify-end gap-3">
            <button type="button" onClick={()=>navigate('/quotes')} className="px-5 py-2.5 text-sm font-medium hover:bg-white/5 rounded-lg border border-transparent">Cancel</button>
            <button type="submit" disabled={!designId||saving} className="px-6 py-2.5 bg-primary text-white rounded-lg text-sm font-semibold hover:bg-blue-500 disabled:opacity-50 flex items-center gap-2">
              {saving && <Spinner size={14}/>} Submit Request
            </button>
          </div>
        </form>
      </div>
    </AppLayout>
  );
}

function QuoteDetail() {

  const id = params?.id || '';
  const [quote,   setQuote]   = useState(null);
  const [loading, setLoading] = useState(true);
  const [ordering,setOrdering]= useState(false);
  const { navigate } = useRouter();

  useEffect(() => { apiFetch(`/quotes/${id}`).then(setQuote).finally(()=>setLoading(false)); }, [id]);

  const acceptBid = async bid => {
    setOrdering(true);
    try {
      const data = await apiFetch('/orders', { method:'POST', body: JSON.stringify({ quoteId:quote.id, designId:quote.designId, providerId:bid.providerId, pricing:{ unitPrice:bid.perUnit, quantity:quote.specs?.quantity||1, total:bid.price, currency:'USD' }, specs:quote.specs }) });
      navigate(`/orders/${data.id}`);
    } catch { setOrdering(false); }
  };

  if (loading) return <AppLayout><div className="p-7">Loading quote...</div></AppLayout>;
  if (!quote)  return <AppLayout><div className="p-7">Quote not found</div></AppLayout>;

  return (
    <AppLayout>
      <Topbar title="Quote Request" subtitle={`ID: ${quote.id.substring(0,8)} • ${quote.status.toUpperCase()}`} />
      <div className="p-7 max-w-5xl mx-auto w-full">
        <div className="grid grid-cols-3 gap-6 mb-8">
          {[['Quantity',`${quote.specs?.quantity||1} units`],['Material',quote.specs?.material||'Standard'],['Finish',quote.specs?.finish||'As Machined']].map(([k,v])=>(
            <div key={k} className="bg-card border border-border rounded-xl p-5">
              <div className="text-[11px] font-semibold text-muted-foreground uppercase mb-1">{k}</div>
              <div className="text-xl font-bold">{v}</div>
            </div>
          ))}
        </div>

        <h2 className="font-bold text-lg mb-4">Received Bids ({quote.bids?.length||0})</h2>
        <div className="space-y-4">
          {quote.bids?.length ? quote.bids.map(bid => (
            <div key={bid.id} className="bg-card border border-border hover:border-primary/50 transition-colors rounded-xl p-6 flex items-center gap-6">
              <div className="w-12 h-12 bg-purple-500/10 text-purple-400 rounded-xl flex items-center justify-center font-bold text-xl">
                {bid.providerName.substring(0,1)}
              </div>
              <div className="flex-1">
                <h3 className="font-bold text-base">{bid.providerName}</h3>
                <div className="flex gap-4 mt-2 text-sm text-muted-foreground">
                  <span className="flex items-center gap-1"><I name="truck" size={14}/> {bid.leadDays} Days Lead</span>
                  <span className="flex items-center gap-1 font-mono"><I name="dollar" size={14}/> {bid.perUnit?.toFixed(2)} / unit</span>
                </div>
              </div>
              <div className="text-right">
                <div className="font-bold text-2xl text-secondary">${bid.price?.toFixed(2)}</div>
                {quote.status === 'open' && (
                  <button onClick={()=>acceptBid(bid)} disabled={ordering} className="mt-2 bg-secondary text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-teal-500 flex items-center gap-2 disabled:opacity-50 transition-colors">
                    {ordering ? <Spinner size={14}/> : <I name="cart" size={14}/>} Accept & Order
                  </button>
                )}
              </div>
            </div>
          )) : (
            <div className="bg-card border border-dashed border-border rounded-xl p-10 text-center text-muted-foreground">
              No bids received yet. Providers are reviewing your request.
            </div>
          )}
        </div>
      </div>
    </AppLayout>
  );
}

// ─── Providers List ───────────────────────────────────────────────────────────
function ProvidersList() {
  const [providers, setProviders] = useState([]);
  const [loading,   setLoading]   = useState(true);

  useEffect(() => { apiFetch('/providers').then(d=>setProviders(d.providers||[])).finally(()=>setLoading(false)); }, []);

  return (
    <AppLayout>
      <Topbar title="Provider Marketplace" subtitle="Verified CNC & Sheet Metal Manufacturers" />
      <div className="p-7">
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          {loading ? Array(6).fill(0).map((_,i)=><div key={i} className="h-64 bg-card border border-border rounded-xl pulse"/>) :
           providers.map((p,i) => (
            <div key={p.id} className="bg-card border border-border rounded-xl p-6 hover:border-primary/50 transition-all cursor-pointer fade-in">
              <div className="flex justify-between items-start mb-4">
                <div className="w-12 h-12 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg" style={{ background:'linear-gradient(135deg,#3d7eff,#a855f7)' }}>
                  {p.companyName.substring(0,1)}
                </div>
                {p.isVerified && (
                  <span className="flex items-center gap-1 text-success text-xs font-semibold bg-success/10 px-2 py-1 rounded-md">
                    <I name="shield" size={12}/> Verified
                  </span>
                )}
              </div>
              <h3 className="font-bold text-lg mb-1 hover:text-primary transition-colors">{p.companyName}</h3>
              <div className="flex items-center gap-1.5 text-sm text-muted-foreground mb-4">
                <I name="map" size={14}/> {p.region}, {p.country}
              </div>
              <div className="grid grid-cols-2 gap-4 mb-4 border-y border-border py-4">
                <div>
                  <div className="text-[10px] text-muted-foreground uppercase tracking-wider font-semibold mb-1">Rating</div>
                  <div className="flex items-center gap-1 text-sm font-bold">
                    <I name="star" size={14} className="text-warning"/> {p.rating} <span className="text-muted-foreground font-normal text-xs">({p.totalReviews})</span>
                  </div>
                </div>
                <div>
                  <div className="text-[10px] text-muted-foreground uppercase tracking-wider font-semibold mb-1">Lead Time</div>
                  <div className="text-sm font-bold">{p.leadTimeDays?.min}-{p.leadTimeDays?.max} Days</div>
                </div>
              </div>
              <div className="flex flex-wrap gap-2">
                {p.materials?.slice(0,3).map(m=><span key={m} className="px-2 py-1 bg-white/5 border border-border rounded text-[11px] font-medium text-muted-foreground">{m}</span>)}
                {(p.materials?.length||0)>3 && <span className="px-2 py-1 bg-white/5 border border-border rounded text-[11px] font-medium text-muted-foreground">+{p.materials.length-3}</span>}
              </div>
            </div>
          ))}
        </div>
      </div>
    </AppLayout>
  );
}

// ─── Orders List ──────────────────────────────────────────────────────────────
function OrdersList() {
  const [orders, setOrders] = useState([]);
  const [loading, setLoading] = useState(true);
  const { navigate } = useRouter();

  useEffect(() => { apiFetch('/orders').then(d=>setOrders(d.orders||[])).finally(()=>setLoading(false)); }, []);

  return (
    <AppLayout>
      <Topbar title="Active Orders" />
      <div className="p-7">
        <div className="bg-card border border-border rounded-xl overflow-hidden">
          <table className="w-full text-left border-collapse">
            <thead>
              <tr className="border-b border-border bg-background/50 text-[11px] uppercase tracking-wider text-muted-foreground font-semibold">
                {['Order No','Provider','Status','Value','Est. Delivery','Action'].map(h=><th key={h} className="p-4 pl-6">{h}</th>)}
              </tr>
            </thead>
            <tbody className="divide-y divide-border">
              {loading ? <tr><td colSpan={6} className="p-8 text-center text-muted-foreground">Loading...</td></tr> :
               orders.length ? orders.map(o => (
                <tr key={o.id} className="hover:bg-white/5 cursor-pointer transition-colors" onClick={()=>navigate(`/orders/${o.id}`)}>
                  <td className="p-4 pl-6 font-mono text-sm font-bold">#{o.orderNumber}</td>
                  <td className="p-4 text-sm font-medium">{o.providerName}</td>
                  <td className="p-4"><Badge label={o.status.replace('_',' ')} variant={o.status}/></td>
                  <td className="p-4 text-sm font-mono">${o.pricing?.total?.toFixed(2)||'0.00'}</td>
                  <td className="p-4 text-sm text-muted-foreground">{o.estimatedDelivery?new Date(o.estimatedDelivery).toLocaleDateString():'TBD'}</td>
                  <td className="p-4 text-right"><I name="chevronRight" size={18} className="text-muted-foreground inline-block"/></td>
                </tr>
               )) : (
                <tr><td colSpan={6} className="p-16 text-center text-muted-foreground">
                  <I name="package" size={40} className="mx-auto mb-3 opacity-20"/><p>No active orders.</p>
                </td></tr>
               )}
            </tbody>
          </table>
        </div>
      </div>
    </AppLayout>
  );
}

// ─── Order Detail ─────────────────────────────────────────────────────────────
function OrderDetail() {
  const [,params] = useRoute('/orders/:id');
  const id = params?.id || '';
  const [order, setOrder] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => { apiFetch(`/orders/${id}`).then(setOrder).finally(()=>setLoading(false)); }, [id]);

  if (loading) return <AppLayout><div className="p-7">Loading order...</div></AppLayout>;
  if (!order)  return <AppLayout><div className="p-7">Order not found</div></AppLayout>;

  const steps = [
    { id:'confirmed',    label:'Confirmed',     icon:'package2' },
    { id:'in_production',label:'Production',    icon:'factory' },
    { id:'qc',           label:'Quality Check', icon:'search' },
    { id:'shipped',      label:'Shipped',       icon:'truck' },
    { id:'delivered',    label:'Delivered',     icon:'checkCircle' },
  ];
  const currentIndex = steps.findIndex(s=>s.id===order.status);

  return (
    <AppLayout>
      <Topbar title={`Order #${order.orderNumber}`} subtitle={`Provider: ${order.providerName}`} />
      <div className="p-7 max-w-4xl mx-auto w-full space-y-8">
        <div className="bg-card border border-border rounded-xl p-8">
          <div className="flex justify-between relative">
            <div className="absolute top-5 left-8 right-8 h-1 bg-border rounded-full" style={{zIndex:0}}/>
            <div className="absolute top-5 left-8 h-1 bg-primary rounded-full transition-all duration-1000" style={{ width:`calc(${(Math.max(0,currentIndex)/(steps.length-1))*100}% - 4rem)`, zIndex:0 }}/>
            {steps.map((step,i) => {
              const isPast = i<=currentIndex, isCurrent = i===currentIndex;
              return (
                <div key={step.id} className="flex flex-col items-center gap-3 w-24" style={{zIndex:1}}>
                  <div className={cn('w-10 h-10 rounded-full flex items-center justify-center transition-colors shadow-lg', isPast?'bg-primary text-white':'bg-background border-2 border-border text-muted-foreground', isCurrent&&'ring-4 ring-primary/20')}>
                    <I name={step.icon} size={18}/>
                  </div>
                  <span className={cn('text-xs font-semibold uppercase tracking-wider text-center', isPast?'text-foreground':'text-muted-foreground')}>{step.label}</span>
                </div>
              );
            })}
          </div>
        </div>

        <div className="grid grid-cols-2 gap-6">
          <div className="bg-card border border-border rounded-xl p-6">
            <h3 className="font-bold text-sm mb-4">Order Details</h3>
            <div className="space-y-4">
              {[['Material',order.specs?.material||'-'],['Quantity',`${order.specs?.quantity||1} units`],['Finish',order.specs?.finish||'As Machined']].map(([k,v])=>(
                <div key={k} className="flex justify-between border-b border-border pb-2 last:border-0 text-sm">
                  <span className="text-muted-foreground">{k}</span><span className="font-medium">{v}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="bg-card border border-border rounded-xl p-6">
            <h3 className="font-bold text-sm mb-4">Pricing</h3>
            <div className="space-y-3 text-sm">
              {[['Subtotal',`$${order.pricing?.subtotal?.toFixed(2)||'0.00'}`],['Shipping',`$${order.pricing?.shipping?.toFixed(2)||'0.00'}`]].map(([k,v])=>(
                <div key={k} className="flex justify-between"><span className="text-muted-foreground">{k}</span><span className="font-mono">{v}</span></div>
              ))}
              <div className="flex justify-between text-base font-bold pt-4 border-t border-border text-secondary">
                <span>Total</span><span className="font-mono">${order.pricing?.total?.toFixed(2)||'0.00'}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </AppLayout>
  );
}

// ─── 404 ──────────────────────────────────────────────────────────────────────
function NotFound() {
  return (
    <div className="h-screen flex flex-col items-center justify-center bg-background text-foreground">
      <div className="text-6xl font-black text-primary mb-4">404</div>
      <p className="text-muted-foreground mb-6">Page not found</p>
      <a href="#/dashboard" className="bg-primary text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-500 transition-colors">Go to Dashboard</a>
    </div>
  );
}

// ─── App shell ────────────────────────────────────────────────────────────────
function App() {
  return (
    <AuthProvider>
      <Router>
        <Routes />
      </Router>
    </AuthProvider>
  );
}

function Routes() {
  const { path } = useRouter();
  const { user, loading } = useAuth();

  if (loading) return <div className="h-screen flex items-center justify-center bg-background"><Spinner size={40}/></div>;

  // Public routes
  if (path === '/' || path === '') return <AuthPage />;

  // Protected — redirect if not logged in
  if (!user) {
    window.location.hash = '/';
    return null;
  }

  // Route matching
  if (path === '/dashboard')             return <Dashboard />;
  if (path === '/designs')               return <DesignsList />;
  if (path === '/designs/upload')        return <DesignUpload />;
  if (/^\/designs\/\w+$/.test(path) && !path.includes('/upload')) return <DesignDetail />;
  if (/^\/convert\/\w+$/.test(path))    return <ConvertPipeline />;
  if (/^\/verify\/\w+$/.test(path))     return <VerifyAnalysis />;
  if (/^\/preview\/\w+$/.test(path))    return <CADPreview />;
  if (path === '/quotes')                return <QuotesList />;
  if (path === '/quotes/new')            return <QuoteNew />;
  if (/^\/quotes\/\w+$/.test(path) && !path.includes('/new')) return <QuoteDetail />;
  if (path === '/providers')             return <ProvidersList />;
  if (path === '/orders')                return <OrdersList />;
  if (/^\/orders\/\w+$/.test(path))     return <OrderDetail />;

  return <NotFound />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
